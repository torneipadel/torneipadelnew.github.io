<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#071219"><title>Verifica di sicurezza | Eventour</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-storage-v1.js?v=1"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:linear-gradient(135deg,#06131d,#0b2940);color:#fff;font:15px Arial,sans-serif}.panel{width:min(520px,100%);padding:28px;border:1px solid #ffffff35;border-radius:18px;background:#ffffff12;box-shadow:0 18px 55px #0006;text-align:center}h1{font-size:22px;margin:0 0 12px}p{line-height:1.5;color:#d7e3eb}#qr{display:none;width:220px;height:220px;max-width:100%;margin:18px auto;background:#fff;padding:10px;border-radius:10px}#secret{display:none;overflow-wrap:anywhere;padding:12px;background:#0005;border-radius:8px;font-family:monospace}input{width:100%;height:48px;margin:12px 0;padding:0 14px;border-radius:9px;border:1px solid #ffffff55;font-size:20px;letter-spacing:5px;text-align:center}button{width:100%;height:46px;margin-top:10px;border:0;border-radius:9px;background:#fff;color:#073b72;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{min-height:24px;margin-top:14px;color:#ffe27a;font-size:13px}small{color:#c6d5df}</style></head>
<body><main class="panel"><h1>Verifica di sicurezza Eventour</h1><p id="intro">Per accedere alla gestione è richiesta la verifica in due passaggi con un'app Authenticator.</p><div id="setup"><p id="instructions">Scansiona il QR code con Google Authenticator, Microsoft Authenticator o un'app compatibile.</p><img id="qr" alt="QR code per configurare l'autenticatore"><p id="secret"></p></div><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Codice a 6 cifre" aria-label="Codice di verifica"><button id="verify">VERIFICA E CONTINUA</button><div id="status" role="status" aria-live="polite"></div><small>Non condividere il codice con nessuno.</small></main>
<script>
(function(){
'use strict';
const URL='https://dkeqicstprvvfebiaooc.supabase.co',KEY='sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu';
const sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const target=params.get('return')||'admin.html',safeReturn=/^(?:admin|eventour-control-center)\.html(?:[?#].*)?$/.test(target)?target:'admin.html';
let factorId='',busy=false;
function status(v){$('status').textContent=v}
async function init(){
 const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace('login.html');return}
 const email=String(session.user?.email||'').trim().toLowerCase();let privileged=email==='giose.rizzi@gmail.com';
 if(!privileged){const p=await sb.from('profili').select('ruolo').eq('user_id',session.user.id).maybeSingle();privileged=['admin','superadmin'].includes(String(p.data?.ruolo||'').toLowerCase())}
 if(!privileged){const a=await sb.rpc('get_my_azienda_access');const row=Array.isArray(a.data)?a.data[0]:a.data;privileged=!a.error&&row?.accesso_consentito&&['owner','admin','superadmin'].includes(String(row.ruolo||'').toLowerCase())}
 if(!privileged){location.replace('dashboard.html');return}
 const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(!aal.error&&aal.data?.currentLevel==='aal2'){location.replace(safeReturn);return}
 const listed=await sb.auth.mfa.listFactors();if(listed.error){$('verify').disabled=true;status('Impossibile verificare i dispositivi MFA: '+listed.error.message);return}
 const verified=(listed.data?.totp||[]).find(f=>f.status==='verified');
 if(verified){factorId=verified.id;$('intro').textContent='Inserisci il codice generato dalla tua app Authenticator.';$('instructions').textContent='Conferma il tuo accesso con il codice temporaneo.';$('setup').style.display='none';status('Verifica in due passaggi richiesta.');return}
 const pending=(listed.data?.totp||[]).find(f=>f.status!=='verified');
 if(pending){$('verify').disabled=true;status('È presente una configurazione MFA non completata. Contatta il supporto per completarla o ripristinarla.');return}
 const enrolled=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Eventour Authenticator'});
 if(enrolled.error){$('verify').disabled=true;status('Configurazione MFA non disponibile: '+enrolled.error.message);return}
 factorId=enrolled.data.id;$('qr').src=enrolled.data.totp.qr_code;$('qr').style.display='block';$('secret').textContent='Chiave manuale: '+enrolled.data.totp.secret;$('secret').style.display='block';status('Scansiona il QR code, poi inserisci il codice a 6 cifre.');
}
$('verify').addEventListener('click',async()=>{if(busy)return;busy=true;$('verify').disabled=true;try{
 const code=$('code').value.replace(/\s/g,'');if(!/^\d{6}$/.test(code))throw new Error('Inserisci un codice valido di 6 cifre.');
 const ch=await sb.auth.mfa.challenge({factorId});if(ch.error)throw ch.error;
 const v=await sb.auth.mfa.verify({factorId,challengeId:ch.data.id,code});if(v.error)throw v.error;
 const refreshed=await sb.auth.refreshSession();if(refreshed.error)throw refreshed.error;
 const aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.error||aal.data?.currentLevel!=='aal2')throw new Error('La verifica non ha raggiunto il livello di sicurezza richiesto. Riprova.');
 status('Verifica completata. Apertura della gestione…');location.replace(safeReturn);
 }catch(e){status(e.message||'Verifica non riuscita. Riprova.');$('verify').disabled=false;busy=false}});
 init().catch(e=>{status(e.message||'Errore durante la verifica MFA.');$('verify').disabled=true});
})();
</script></body></html>
