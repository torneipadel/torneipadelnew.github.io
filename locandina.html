<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Open Sans',Arial,sans-serif}body{display:flex;justify-content:center;align-items:flex-start;padding:24px 14px 40px;background:linear-gradient(rgba(7,18,25,.38),rgba(7,18,25,.55)),url('2pages.jpg') center/cover fixed no-repeat;color:#fff}.page{width:min(720px,100%);text-align:center}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{font-size:13px;font-weight:800;letter-spacing:.08em}.back,.share{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;text-decoration:none;border-radius:10px;padding:8px 11px;font-size:9px;font-weight:700;cursor:pointer}.card{padding:14px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(20,24,29,.76);backdrop-filter:blur(12px);box-shadow:0 22px 65px rgba(0,0,0,.32)}h1{font-size:19px;margin:2px 0 5px}.meta{font-size:10px;color:rgba(255,255,255,.58);margin-bottom:13px}.poster{display:block;width:auto;max-width:100%;max-height:78vh;margin:0 auto;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.38);object-fit:contain}.actions{display:flex;justify-content:center;gap:7px;margin-top:13px}.status{font-size:10px;color:rgba(255,255,255,.62);padding:30px}.error{color:#ffb4b4}@media(max-width:520px){body{padding:14px 9px}.head{align-items:flex-start}.brand{font-size:11px}.card{padding:10px;border-radius:16px}.poster{max-height:72vh}}
</style>
<link rel="stylesheet" href="mobile-layout-fixes.css?v=1">
<style>/* Marchio Eventour uniforme: riferimento news.html */.news-brand-banner{position:relative;isolation:isolate;width:min(760px,calc(100% - 28px));height:125px;margin:18px auto 16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:url("FOTO_PADEL1.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.30);box-sizing:border-box}.news-brand-banner:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(3,17,31,.62),rgba(3,17,31,.28),rgba(3,17,31,.58));pointer-events:none}.news-eventour-logo{position:relative;z-index:1;display:block;width:min(560px,94%);height:78px;max-width:94%;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;filter:none;opacity:1}.news-brand-subtitle{position:relative;z-index:1;color:#fff;font-family:'Open Sans',Arial,sans-serif;font-size:15px;font-style:italic;font-weight:700;letter-spacing:1.6px;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.7);text-align:center}@media(max-width:600px){.news-brand-banner{height:112px;margin:10px auto 13px;border-radius:19px}.news-eventour-logo{height:70px;width:92%;max-width:92%}.news-brand-subtitle{font-size:13px;letter-spacing:1.2px}}@media(max-width:390px){.news-brand-banner{height:104px}.news-eventour-logo{height:64px;width:92%;max-width:92%}.news-brand-subtitle{font-size:12px;letter-spacing:1px}}</style></head>
<body><section class="news-brand-banner" aria-label="EVENTOUR gestione &amp; eventi"><img src="eventour_logo.jpg" class="news-eventour-logo" alt="EVENTOUR"><span class="news-brand-subtitle">gestione eventi &amp; tornei</span></section>
<main class="page">
  <div class="head"><a class="back" href="visitatore.html">← VISITATORE</a><div class="brand">eventour gestione &amp; eventi</div><button class="share" id="shareLink" type="button">COPIA LINK</button></div>
  <section class="card" id="app"><div class="status">Caricamento locandina…</div></section>
</main>
<script>
const SUPABASE_URL='https://iybjvtmfaupgthqqsngd.supabase.co';
const SUPABASE_KEY='sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=new URLSearchParams(location.search).get('id');
document.getElementById('shareLink').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('shareLink').textContent='LINK COPIATO';setTimeout(()=>document.getElementById('shareLink').textContent='COPIA LINK',1800)}catch(e){window.prompt('Copia questo link:',location.href)}};
async function load(){const app=document.getElementById('app');if(!id){app.innerHTML='<div class="status error">Locandina non disponibile: manca il torneo.</div>';return}try{const {data,error}=await sb.from('tornei').select('id,nome,data,configurazione,pubblicato,stato').eq('id',Number(id)).maybeSingle();if(error)throw error;if(!data){app.innerHTML='<div class="status error">Torneo non trovato.</div>';return}const news=Array.isArray(data.configurazione?.news)?data.configurazione.news:[];const item=news.find(n=>n?.immagine);const src=item?.immagine||'';if(!src){app.innerHTML=`<div class="status error">La locandina non è disponibile per <strong>${esc(data.nome||'questo torneo')}</strong>.</div>`;return}const d=data.data?new Date(data.data):null;const date=d&&!isNaN(d.getTime())?d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'}):'';app.innerHTML=`<h1>${esc(data.nome||'Locandina torneo')}</h1><div class="meta">${esc(date)}</div><img class="poster" src="${esc(src)}" alt="Locandina ${esc(data.nome||'torneo')}"><div class="actions"><button class="share" type="button" onclick="window.print()">STAMPA / PDF</button></div>`;document.title=(data.nome||'Locandina')+' | Eventour'}catch(err){console.error('[LOCANDINA]',err);app.innerHTML='<div class="status error">Impossibile caricare la locandina.</div>'}}
load();
</script>
<script src="site-navigation-v1.js?v=5"></script>
<script>(function isolateNewsEventourLogo(){const logo=document.querySelector(".news-eventour-logo");if(!logo)return;function isolate(){if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;logo.dataset.textIsolated="1";try{const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png")}catch(e){console.warn("Trattamento logo Eventour non riuscito:",e)}}if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true})})();</script></body>
