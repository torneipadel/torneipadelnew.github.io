<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Sponsor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#004a99;--green:#16a34a;--red:#dc2626;--gold:#ffeb3b;--border:rgba(255,255,255,.25)}
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}
body{padding:20px;background:linear-gradient(rgba(0,0,0,.20),rgba(0,0,0,.20)),url("sfondo_admin.jpg") center/cover fixed;font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;color:#fff}
.container{width:100%;max-width:900px;margin:auto}.card{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 8px 25px rgba(0,0,0,.22)}
h1,h2,h3{font-weight:600}label{display:block;font-size:13px;margin-top:10px}input,textarea{width:100%;padding:10px;margin:8px 0 15px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.92);color:#333;font:13px Arial,sans-serif}textarea{min-height:90px}
button{background:var(--blue);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;margin:5px;font-size:13px}button:hover{opacity:.85}.btn-green{background:var(--green)}.btn-red{background:var(--red)}.lista-item{background:rgba(0,0,0,.28);padding:15px;border-radius:10px;margin:10px 0}.logo{max-width:220px;max-height:100px;object-fit:contain;background:#fff;border-radius:8px;padding:5px;margin:8px 0}video{width:100%;max-width:420px;border-radius:10px;margin-top:8px}.small{opacity:.85;font-size:12px}.btn-indietro{position:fixed;top:12px;right:12px;z-index:9999;background:transparent;width:30px;height:30px;padding:0;font-size:22px}
</style></head><body>
<button class="btn-indietro" onclick="history.back()" aria-label="Indietro">→</button>
<div class="container">
<div class="card"><h1>🏆 Gestione Sponsor</h1><p>Gli sponsor vengono salvati in Supabase e sono quindi visibili anche nelle pagine pubbliche.</p></div>
<div class="card"><h2>➕ Nuovo sponsor</h2>
<label>Nome sponsor / azienda</label><input id="sponsorNome" placeholder="Nome azienda">
<label>Immagine / Logo (URL)</label><input id="sponsorImmagine" placeholder="https://...">
<label>Video in loop (URL)</label><input id="sponsorVideo" placeholder="https://...">
<label>Link sponsor</label><input id="sponsorLink" placeholder="https://...">
<label>Descrizione</label><textarea id="sponsorDescrizione" placeholder="Descrizione dello sponsor..."></textarea>
<button onclick="salvaSponsor()" class="btn-green">💾 Salva sponsor</button><button onclick="inserisciSponsorEsempio()">🧪 Inserisci esempio completo</button></div>
<div class="card"><h2>📋 Sponsor registrati</h2><div id="listaSponsorAdmin">Caricamento...</div></div></div>
<script>
const SPONSOR_STORAGE="padel_sponsor_standalone";
const SUPABASE_URL="https://iybjvtmfaupgthqqsngd.supabase.co";
const SUPABASE_KEY="sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl";
const sbSponsor=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let sponsorList=[];
function valore(id){return document.getElementById(id)?.value.trim()||""}
function salvaLocale(){try{localStorage.setItem(SPONSOR_STORAGE,JSON.stringify(sponsorList))}catch(e){}}
function leggiLocale(){try{const raw=localStorage.getItem(SPONSOR_STORAGE);const a=raw?JSON.parse(raw):[];return Array.isArray(a)?a:[]}catch(e){return[]}}
async function caricaSponsor(){
  try{
    const {data,error}=await sbSponsor.from("sponsor").select("id,nome,immagine,video,link").order("id",{ascending:true});
    if(!error&&Array.isArray(data)){
      sponsorList=data;
      salvaLocale();
      renderSponsor();
      return;
    }
    console.warn("Supabase sponsor non disponibile",error);
  }catch(e){console.warn("Errore Supabase sponsor",e)}
  sponsorList=leggiLocale();
  renderSponsor();
}
async function salvaSponsor(){
  const nome=valore("sponsorNome");
  if(!nome){alert("Inserisci il nome dello sponsor");return}
  const sponsor={nome,immagine:valore("sponsorImmagine"),video:valore("sponsorVideo"),link:valore("sponsorLink")};
  try{
    const {data,error}=await sbSponsor.from("sponsor").insert(sponsor).select("id,nome,immagine,video,link").single();
    if(error)throw error;
    sponsorList.unshift(data);salvaLocale();pulisciForm();renderSponsor();return;
  }catch(e){
    console.warn("Salvataggio Supabase sponsor fallito, uso locale",e);
    sponsorList.unshift({...sponsor,id:Date.now()});salvaLocale();pulisciForm();renderSponsor();
    alert("Sponsor salvato localmente. Supabase non ha accettato il salvataggio.");
  }
}
async function inserisciSponsorEsempio(){
  const sponsor={nome:"Padel Club Roma",immagine:"https://placehold.co/800x300/png?text=PADEL+CLUB+ROMA",video:"https://www.w3schools.com/html/mov_bbb.mp4",link:"https://www.google.com/"};
  try{
    const {data:esistenti}=await sbSponsor.from("sponsor").select("id").limit(1);
    if(esistenti?.length){renderSponsor();return}
    const {data,error}=await sbSponsor.from("sponsor").insert(sponsor).select("id,nome,immagine,video,link").single();
    if(error)throw error;
    sponsorList=[data];salvaLocale();renderSponsor();
  }catch(e){
    console.warn("Esempio Supabase fallito",e);
    if(!sponsorList.length){sponsorList=[{...sponsor,id:"DEMO_SPONSOR"}];salvaLocale();renderSponsor()}
  }
}
function pulisciForm(){["sponsorNome","sponsorImmagine","sponsorVideo","sponsorLink","sponsorDescrizione"].forEach(id=>{const e=document.getElementById(id);if(e)e.value=""})}
async function eliminaSponsor(id){
  try{
    const {error}=await sbSponsor.from("sponsor").delete().eq("id",id);
    if(error)throw error;
  }catch(e){console.warn("Eliminazione Supabase fallita",e)}
  sponsorList=sponsorList.filter(s=>String(s.id)!==String(id));salvaLocale();renderSponsor();
}
function renderSponsor(){
  const box=document.getElementById("listaSponsorAdmin");if(!box)return;
  if(!sponsorList.length){box.innerHTML="<p>Nessun sponsor registrato.</p>";return}
  box.innerHTML=sponsorList.map(s=>`<div class="lista-item"><h3>${escapeHtml(s.nome)}</h3>${s.immagine?`<img class="logo" src="${escapeAttr(s.immagine)}" alt="Logo ${escapeAttr(s.nome)}" onerror="this.style.display='none'">`:""}${s.video?`<video controls autoplay muted loop playsinline><source src="${escapeAttr(s.video)}"></video>`:""}${s.link?`<p><a href="${escapeAttr(s.link)}" target="_blank" rel="noopener" style="color:#ffeb3b">🔗 Apri sito sponsor</a></p>`:""}<button class="btn-red" onclick="eliminaSponsor('${String(s.id).replace(/'/g,"\\'")}')">🗑 Elimina</button></div>`).join("")
}
function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function escapeAttr(v){return escapeHtml(v)}
document.addEventListener("DOMContentLoaded",caricaSponsor);
</script></body></html>
