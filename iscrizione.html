<body>
<div class="card">
<section class="news-brand-banner" aria-label="EVENTOUR gestione & eventi"><img src="eventour_logo.jpg?v=20261018" class="news-eventour-logo" alt="EVENTOUR"><span class="news-brand-subtitle">gestione eventi &amp; tornei</span></section>
<h2>🏆 Iscrizione torneo</h2>
<div id="datiTorneo">Caricamento torneo...</div>
<div id="datiUtente"></div>
<p class="privacy-note">I dati inseriti sono utilizzati per gestire la tua iscrizione e la partecipazione al torneo. Il tuo indirizzo e-mail e il numero di telefono non vengono pubblicati nella pagina pubblica del torneo. <a href="privacy.html" target="_blank" rel="noopener noreferrer">Leggi l’informativa privacy</a>.</p><button id="btnConferma" class="btn" onclick="confermaIscrizione()">CONFERMA ISCRIZIONE</button>
<button class="back" onclick="tornaTornei()">⬅ Torna ai tornei</button>
<div id="messaggio"></div>
</div>
<script>
const sb=supabase.createClient("https://dkeqicstprvvfebiaooc.supabase.co","sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const params=new URLSearchParams(window.location.search);
const publicAziendaSlug=params.get("azienda")||"";
const torneoId=params.get("torneo");
let torneo=null,utente=null,profilo=null,aziendaRecord=null,iscrittiCorrenti=0,limiteCorrente=0;
async function inizializza(){try{
 if(!torneoId||!publicAziendaSlug){mostraMessaggio("❌ Torneo o società non specificati. Riapri il torneo dalla pagina della tua società.","errore");document.getElementById("btnConferma").disabled=true;return}
 const {data:{user},error:erroreUser}=await sb.auth.getUser();if(erroreUser||!user){window.location.href="login-utente.html?azienda="+encodeURIComponent(publicAziendaSlug);return}utente=user;
 const companyResult=await sb.rpc("get_public_company",{p_slug:publicAziendaSlug});aziendaRecord=Array.isArray(companyResult.data)?companyResult.data[0]:companyResult.data;
 if(companyResult.error||!aziendaRecord?.id){mostraMessaggio("❌ Società non trovata o non attiva.","errore");document.getElementById("btnConferma").disabled=true;return}
 const meta=user.user_metadata||{};
 const membership=await sb.rpc("complete_visitor_membership",{p_azienda_slug:aziendaRecord.slug,p_nome:meta.nome||meta.first_name||null,p_cognome:meta.cognome||meta.last_name||null,p_telefono:meta.telefono||null});
 const member=Array.isArray(membership.data)?membership.data[0]:membership.data;
 const ruoloMembership=String(member?.ruolo||"").toLowerCase();const ruoliIscrizioneConsentiti=["user","owner","admin","superadmin"];if(membership.error||!member?.ok||String(member.azienda_id)!==String(aziendaRecord.id)||!ruoliIscrizioneConsentiti.includes(ruoloMembership)){console.error("Account non autorizzato all’iscrizione nel contesto società",membership.error||member);mostraMessaggio("❌ Non è possibile iscriversi: verifica l’accesso alla società e riprova.","errore");document.getElementById("btnConferma").disabled=true;return}
 const {data:tornei,error:erroreTorneo}=await sb.rpc("get_public_tornei",{p_torneo_id:Number(torneoId),p_azienda_id:aziendaRecord.id});
 const torneoLetto=Array.isArray(tornei)?tornei.find(t=>String(t.id)===String(torneoId)):null;
 if(erroreTorneo||!torneoLetto||String(torneoLetto.azienda_id)!==String(aziendaRecord.id)){console.error("Errore caricamento torneo",erroreTorneo);mostraMessaggio("❌ Torneo non trovato per questa società.","errore");document.getElementById("btnConferma").disabled=true;return}torneo=torneoLetto;
 const {data:profiloLetto,error:erroreProfilo}=await sb.from("profili").select(`nome,cognome,email,telefono,livello,note`).eq("user_id",user.id).maybeSingle();if(erroreProfilo)console.warn("Profilo non trovato",erroreProfilo);profilo=profiloLetto||null;await aggiornaDisponibilita();mostraDati()
 }catch(e){console.error("Errore inizializzazione iscrizione:",e);mostraMessaggio("❌ Errore caricamento pagina","errore");document.getElementById("btnConferma").disabled=true}}
function getNumeroSquadre(){let numero=0;if(torneo?.configurazione?.rules?.numeroSquadre)numero=Number(torneo.configurazione.rules.numeroSquadre);if(!numero&&torneo?.posti)numero=Number(torneo.posti);return numero||8}
function iscrizioniChiuse(){return torneo?.iscrizioni_chiuse===true||["chiuso","concluso","archiviato"].includes(String(torneo?.stato||"").toLowerCase())}
async function aggiornaDisponibilita(){if(!torneo)return false;limiteCorrente=getNumeroSquadre()*2;iscrittiCorrenti=0;const {data,error}=await sb.rpc("get_torneo_iscrizioni_count",{p_torneo_id:Number(torneo.id)});if(error){console.error("[CONTEGGIO ISCRIZIONI] RPC errore:",error);mostraMessaggio("❌ Impossibile verificare i posti disponibili. Riprova tra poco.","errore");return false}iscrittiCorrenti=Number(data)||0;if(iscrittiCorrenti>=limiteCorrente&&!torneo.iscrizioni_chiuse){torneo.iscrizioni_chiuse=true;torneo.stato="chiuso"}return true}
function mostraDati(){const boxTorneo=document.getElementById("datiTorneo");if(!boxTorneo||!torneo)return;const giocatori=limiteCorrente||getNumeroSquadre()*2,posti=Math.max(0,giocatori-iscrittiCorrenti),chiuso=iscrizioniChiuse()||iscrittiCorrenti>=giocatori;boxTorneo.innerHTML=`<div class="info">🏆 <b>${torneo.nome||"Torneo"}</b><br><br>📅 Data: ${torneo.data||"-"}<br>🎾 Formula: ${torneo.formula||torneo.configurazione?.rules?.tipoTorneo||"Padel"}<br>👥 Iscritti: ${iscrittiCorrenti}/${giocatori} giocatori<br>🟢 Posti disponibili: ${posti}${posti>0&&posti<=3?`<br><b>🔥 ULTIMI ${posti} POSTI</b>`:""}<br><br>Stato: ${chiuso?"❌ TORNEO COMPLETO / ISCRIZIONI CHIUSE":"🟢 Iscrizioni aperte"}</div>`;const boxUtente=document.getElementById("datiUtente");if(boxUtente){boxUtente.innerHTML=profilo?`<div class="info">👤 Giocatore:<br><b>${profilo.nome||""} ${profilo.cognome||""}</b><br>📧 ${utente.email||""}</div>`:`<div class="info">👤 Utente:<br><b>${utente.email||""}</b></div>`}const btn=document.getElementById("btnConferma");if(btn){btn.disabled=chiuso;btn.textContent=chiuso?"ISCRIZIONI CHIUSE":"CONFERMA ISCRIZIONE"}}
async function confermaIscrizione(){if(!torneo||!utente){mostraMessaggio("❌ Dati torneo o utente mancanti","errore");return}await aggiornaDisponibilita();mostraDati();if(iscrizioniChiuse()||iscrittiCorrenti>=limiteCorrente){mostraMessaggio("❌ Torneo completo: non ci sono più posti disponibili","errore");return}const {data:giaIscritto,error:erroreGia}=await sb.from("iscrizioni").select("id").eq("torneo_id",torneo.id).eq("azienda_id",aziendaRecord.id).eq("user_id",utente.id);if(erroreGia){console.error("Errore controllo iscrizione:",erroreGia);return}if(giaIscritto?.length){mostraMessaggio("⚠️ Sei già iscritto a questo torneo","errore");return}const nome=profilo?.nome||utente.email.split("@")[0],cognome=profilo?.cognome||"",alias=cognome?cognome.substring(0,6).toUpperCase():nome.substring(0,6).toUpperCase();const {error:erroreInsert}=await sb.from("iscrizioni").insert({torneo_id:torneo.id,azienda_id:aziendaRecord.id,user_id:utente.id,nome_giocatore:alias,nome,cognome,email:utente.email||"",telefono:profilo?.telefono||"",livello:profilo?.livello||"",note:profilo?.note||"",categoria:"Open",stato:"richiesta",approvato:false,data_iscrizione:new Date().toISOString()});if(erroreInsert){console.error("Errore inserimento iscrizione:",erroreInsert);mostraMessaggio("❌ Errore iscrizione: "+erroreInsert.message,"errore");return}mostraMessaggio("✅ Richiesta iscrizione inviata","successo");setTimeout(()=>{window.location.href=publicAziendaSlug?('visitatore.html?azienda='+encodeURIComponent(publicAziendaSlug)):'visitatore.html'},1500)}
function mostraMessaggio(testo,tipo){const box=document.getElementById("messaggio");if(!box)return;box.className=tipo;box.innerHTML="<p>"+testo+"</p>"}
function tornaTornei(){window.location.href=publicAziendaSlug?('visitatore.html?azienda='+encodeURIComponent(publicAziendaSlug)):'visitatore.html'}
async function avviaIscrizione(){console.log("Avvio pagina iscrizione");await inizializza();console.log("Pagina iscrizione caricata",torneo)}
window.addEventListener("load",avviaIscrizione);
</script>

<script>
(function isolateNewsEventourLogo(){
 const logo=document.querySelector(".news-eventour-logo");
 if(!logo)return;
 function isolate(){
  if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;
  logo.dataset.textIsolated="1";
  try{
   const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;
   const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);
   const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;
   for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}
   ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png");
  }catch(e){console.warn("Isolamento logo EVENTOUR nella pagina iscrizione non riuscito:",e)}
 }
 if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true});
})();
</script>
