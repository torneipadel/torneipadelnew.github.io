<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iscrizione Torneo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-image:url('2pages.jpg');--line:rgba(255,255,255,.22);--blue:#073b72}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Open Sans",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:#fff;background:linear-gradient(rgba(7,18,25,.28),rgba(7,18,25,.44)),var(--bg-image) center/cover fixed no-repeat;overflow-x:hidden}
.card{width:min(570px,100%);min-height:640px;margin:0 auto;padding:38px 42px 32px;border:1px solid rgba(255,255,255,.22);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.055));box-shadow:0 18px 50px rgba(0,0,0,.30);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.logo{width:auto;max-width:300px;height:auto;max-height:155px;display:block;margin:0 auto 12px;object-fit:contain;filter:brightness(1.24) contrast(.90) saturate(.82) drop-shadow(0 0 8px rgba(255,255,255,.18)) drop-shadow(0 10px 24px rgba(0,0,0,.22));opacity:.98}
h2{margin:0 0 19px;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.20)}
.info{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);padding:14px 15px;border-radius:10px;margin:0 0 16px;font-size:13px;font-weight:400;color:rgba(255,255,255,.92);box-shadow:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);line-height:1.5;text-align:left}
.info b{font-weight:800}
button{width:100%;height:48px;border:1px solid rgba(255,255,255,.20);border-radius:11px;color:#073b72;font:800 13px/1.2 "Open Sans",Arial,sans-serif;letter-spacing:.6px;cursor:pointer;background:#fff;transition:.2s ease;box-shadow:0 7px 18px rgba(0,0,0,.10);display:block;margin:0}
button+button{margin-top:11px}
.btn{background:#fff;color:var(--blue)}.back{background:rgba(0,0,0,.22);color:#fff;box-shadow:none}
button:hover{background:#fff;transform:translateY(-1px);box-shadow:0 9px 22px rgba(0,0,0,.15)}button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.successo{color:#86efac;font-size:13px;font-weight:700;line-height:1.45;margin-top:14px}.errore{color:#fecaca;font-size:13px;font-weight:700;line-height:1.45;margin-top:14px}
#messaggio p{margin:0}
@media(max-width:767px){body{padding:18px 12px;align-items:center;background-attachment:scroll}.card{width:min(570px,100%);min-height:calc(100dvh - 36px);padding:30px 22px 25px;border-radius:18px}.logo{max-width:250px;max-height:130px}h2{font-size:18px;margin-bottom:19px}.info{font-size:13px;padding:14px 14px;margin-bottom:16px;line-height:1.5}button{height:46px;font-size:13px}}
@media(max-width:380px){body{padding:14px 10px;align-items:center}.card{min-height:calc(100dvh - 28px);padding:25px 18px 22px;border-radius:16px}.logo{max-width:215px;max-height:112px;margin-bottom:10px}h2{font-size:17px;margin-bottom:19px}.info{font-size:12px;padding:13px 13px;margin-bottom:16px;line-height:1.5}}
 .privacy-note{font-size:11px;line-height:1.55;color:rgba(255,255,255,.68);margin:0 0 14px}.privacy-note a{color:#fff;font-weight:700} </style>
</head>
<body>
<div class="card">
<img src="/loghi/icona_app1.jpg" class="logo" alt="NEXT POINT PADEL">
<h2>🏆 Iscrizione torneo</h2>
<div id="datiTorneo">Caricamento torneo...</div>
<div id="datiUtente"></div>
<p class="privacy-note">I dati inseriti sono utilizzati per gestire la tua iscrizione e la partecipazione al torneo. Il tuo indirizzo e-mail e il numero di telefono non vengono pubblicati nella pagina pubblica del torneo. <a href="privacy.html" target="_blank" rel="noopener noreferrer">Leggi l’informativa privacy</a>.</p><button id="btnConferma" class="btn" onclick="confermaIscrizione()">CONFERMA ISCRIZIONE</button>
<button class="back" onclick="tornaTornei()">⬅ Torna ai tornei</button>
<div id="messaggio"></div>
</div>
<script>
const sb=supabase.createClient("https://dkeqicstprvvfebiaooc.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZXFpY3N0cHJ2dmZiaWFvY29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNjQ2NjksImV4cCI6MjA3Njc0MDY2OX0.MPlE8CZ2B8pEhSJzTWBJ-FfFLQpwRAxlAlno-SCylWg",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const torneoId=new URLSearchParams(window.location.search).get("torneo");
let torneo=null,utente=null,profilo=null,iscrittiCorrenti=0,limiteCorrente=0;
async function inizializza(){try{if(!torneoId){mostraMessaggio("❌ Torneo non selezionato","errore");return}const {data:{user},error:erroreUser}=await sb.auth.getUser();if(erroreUser||!user){window.location.href="index.html";return}utente=user;const {data:torneoLetto,error:erroreTorneo}=await sb.from("tornei").select(`id,nome,data,posti,stato,iscrizioni_chiuse,formula,configurazione`).eq("id",Number(torneoId)).single();if(erroreTorneo||!torneoLetto){console.error("Errore caricamento torneo",erroreTorneo);mostraMessaggio("❌ Torneo non trovato","errore");return}torneo=torneoLetto;const {data:profiloLetto,error:erroreProfilo}=await sb.from("profili").select(`nome,cognome,email,telefono,livello,note`).eq("user_id",user.id).single();if(erroreProfilo)console.warn("Profilo non trovato",erroreProfilo);profilo=profiloLetto||null;await aggiornaDisponibilita();mostraDati()}catch(e){console.error("Errore inizializzazione iscrizione:",e);mostraMessaggio("❌ Errore caricamento pagina","errore")}}
function getNumeroSquadre(){let numero=0;if(torneo?.configurazione?.rules?.numeroSquadre)numero=Number(torneo.configurazione.rules.numeroSquadre);if(!numero&&torneo?.posti)numero=Number(torneo.posti);return numero||8}
function iscrizioniChiuse(){return torneo?.iscrizioni_chiuse===true||["chiuso","concluso","archiviato"].includes(String(torneo?.stato||"").toLowerCase())}
async function aggiornaDisponibilita(){if(!torneo)return false;limiteCorrente=getNumeroSquadre()*2;iscrittiCorrenti=0;const {data,error}=await sb.rpc("get_torneo_iscrizioni_count",{p_torneo_id:Number(torneo.id)});if(error){console.error("[CONTEGGIO ISCRIZIONI] RPC errore:",error);mostraMessaggio("❌ Impossibile verificare i posti disponibili. Riprova tra poco.","errore");return false}iscrittiCorrenti=Number(data)||0;if(iscrittiCorrenti>=limiteCorrente&&!torneo.iscrizioni_chiuse){const r=await sb.from("tornei").update({iscrizioni_chiuse:true,stato:"chiuso"}).eq("id",torneo.id);if(!r.error){torneo.iscrizioni_chiuse=true;torneo.stato="chiuso"}}return true}
function mostraDati(){const boxTorneo=document.getElementById("datiTorneo");if(!boxTorneo||!torneo)return;const giocatori=limiteCorrente||getNumeroSquadre()*2,posti=Math.max(0,giocatori-iscrittiCorrenti),chiuso=iscrizioniChiuse()||iscrittiCorrenti>=giocatori;boxTorneo.innerHTML=`<div class="info">🏆 <b>${torneo.nome||"Torneo"}</b><br><br>📅 Data: ${torneo.data||"-"}<br>🎾 Formula: ${torneo.formula||torneo.configurazione?.rules?.tipoTorneo||"Padel"}<br>👥 Iscritti: ${iscrittiCorrenti}/${giocatori} giocatori<br>🟢 Posti disponibili: ${posti}${posti>0&&posti<=3?`<br><b>🔥 ULTIMI ${posti} POSTI</b>`:""}<br><br>Stato: ${chiuso?"❌ TORNEO COMPLETO / ISCRIZIONI CHIUSE":"🟢 Iscrizioni aperte"}</div>`;const boxUtente=document.getElementById("datiUtente");if(boxUtente){boxUtente.innerHTML=profilo?`<div class="info">👤 Giocatore:<br><b>${profilo.nome||""} ${profilo.cognome||""}</b><br>📧 ${utente.email||""}</div>`:`<div class="info">👤 Utente:<br><b>${utente.email||""}</b></div>`}const btn=document.getElementById("btnConferma");if(btn){btn.disabled=chiuso;btn.textContent=chiuso?"ISCRIZIONI CHIUSE":"CONFERMA ISCRIZIONE"}}
async function confermaIscrizione(){if(!torneo||!utente){mostraMessaggio("❌ Dati torneo o utente mancanti","errore");return}await aggiornaDisponibilita();mostraDati();if(iscrizioniChiuse()||iscrittiCorrenti>=limiteCorrente){mostraMessaggio("❌ Torneo completo: non ci sono più posti disponibili","errore");return}const {data:giaIscritto,error:erroreGia}=await sb.from("iscrizioni").select("id").eq("torneo_id",torneo.id).eq("user_id",utente.id);if(erroreGia){console.error("Errore controllo iscrizione:",erroreGia);return}if(giaIscritto?.length){mostraMessaggio("⚠️ Sei già iscritto a questo torneo","errore");return}const nome=profilo?.nome||utente.email.split("@")[0],cognome=profilo?.cognome||"",alias=cognome?cognome.substring(0,6).toUpperCase():nome.substring(0,6).toUpperCase();const {error:erroreInsert}=await sb.from("iscrizioni").insert({torneo_id:torneo.id,user_id:utente.id,nome_giocatore:alias,nome,cognome,email:utente.email||"",telefono:profilo?.telefono||"",livello:profilo?.livello||"",note:profilo?.note||"",categoria:"Open",stato:"richiesta",approvato:false,data_iscrizione:new Date().toISOString()});if(erroreInsert){console.error("Errore inserimento iscrizione:",erroreInsert);mostraMessaggio("❌ Errore iscrizione: "+erroreInsert.message,"errore");return}mostraMessaggio("✅ Richiesta iscrizione inviata","successo");setTimeout(()=>{window.location.href="visitatore.html"},1500)}
function mostraMessaggio(testo,tipo){const box=document.getElementById("messaggio");if(!box)return;box.className=tipo;box.innerHTML="<p>"+testo+"</p>"}
function tornaTornei(){window.location.href="visitatore.html"}
async function avviaIscrizione(){console.log("Avvio pagina iscrizione");await inizializza();console.log("Pagina iscrizione caricata",torneo)}
window.addEventListener("load",avviaIscrizione);
</script>
<script src="torneo-flow-public-fix-v1.js?v=2"></script>
<script src="sponsor-public-v2.js?v=3"></script>
</body>
</html>
