<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova gratuita — Eventour</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-storage-v1.js?v=1"></script><style>body{margin:0;background:#071219;color:#fff;font-family:Arial;padding:30px}main{max-width:620px;margin:auto;padding:35px;border:1px solid #ffffff30;border-radius:24px;background:#ffffff0d}h1{margin-top:0}p{color:#bbb;line-height:1.6}label{display:block;margin:15px 0 6px;font-weight:bold;font-size:13px}input{width:100%;height:46px;box-sizing:border-box;border-radius:10px;border:1px solid #ffffff35;background:#ffffff10;color:#fff;padding:0 12px}button{width:100%;height:48px;margin-top:22px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.consent{display:flex;align-items:flex-start;gap:10px;font-size:12px;font-weight:normal;color:#ddd;line-height:1.5;margin:12px 0}.consent input{width:auto;height:auto;margin-top:3px;flex:0 0 auto}.consent a{color:#ffe76b}.status{margin-top:15px;color:#ffe76b;text-align:center}</style><style>/* Marchio Eventour uniforme: riferimento news.html */.news-brand-banner{position:relative;isolation:isolate;width:min(760px,calc(100% - 28px));height:125px;margin:18px auto 16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:url("FOTO_PADEL1.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.30);box-sizing:border-box}.news-brand-banner:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(3,17,31,.62),rgba(3,17,31,.28),rgba(3,17,31,.58));pointer-events:none}.news-eventour-logo{position:relative;z-index:1;display:block;width:min(560px,94%);height:78px;max-width:94%;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;filter:none;opacity:1}.news-brand-subtitle{position:relative;z-index:1;color:#fff;font-family:'Open Sans',Arial,sans-serif;font-size:15px;font-style:italic;font-weight:700;letter-spacing:1.6px;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.7);text-align:center}@media(max-width:600px){.news-brand-banner{height:112px;margin:10px auto 13px;border-radius:19px}.news-eventour-logo{height:70px;width:92%;max-width:92%}.news-brand-subtitle{font-size:13px;letter-spacing:1.2px}}@media(max-width:390px){.news-brand-banner{height:104px}.news-eventour-logo{height:64px;width:92%;max-width:92%}.news-brand-subtitle{font-size:12px;letter-spacing:1px}}</style></head><body><section class="news-brand-banner" aria-label="EVENTOUR gestione &amp; eventi"><img src="eventour_logo.jpg" class="news-eventour-logo" alt="EVENTOUR"><span class="news-brand-subtitle">gestione eventi &amp; tornei</span></section><main><h1>Prova gratuita</h1><p>Prova Eventour senza impegno. Creeremo un ambiente demo dedicato alla tua società con un periodo di prova di 14 giorni.</p><form id="f"><label>Nome società *</label><input id="company" required><label>Nome *</label><input id="name" required><label>Cognome *</label><input id="surname" required><label>Email *</label><input id="email" type="email" required><label>Password *</label><input id="password" type="password" minlength="12" maxlength="72" required><label class="consent"><input id="privacy" type="checkbox" required><span>Ho letto l’<a href="privacy.html" target="_blank" rel="noopener noreferrer">informativa Privacy</a>.</span></label><label class="consent"><input id="terms" type="checkbox" required><span>Accetto i <a href="termini.html" target="_blank" rel="noopener noreferrer">Termini del servizio</a>.</span></label><button>CREA LA DEMO</button></form><div class="status" id="s"></div></main><script>
const sb=supabase.createClient("https://dkeqicstprvvfebiaooc.supabase.co","sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
(async()=>{
 const params=new URLSearchParams(location.search);
 if(params.get("complete")!=="1")return;
 const status=document.getElementById("s");
 const {data,error}=await sb.auth.getSession();
 if(error||!data?.session){status.textContent="Conferma email completata. Accedi per proseguire.";return}
 const meta=data.session.user.user_metadata||{};
 if(meta.privacy_accettata!=="true"||meta.termini_accettati!=="true"){
  await sb.auth.signOut();
  status.textContent="Consenso Privacy e Termini non verificabile. Ripeti la registrazione.";
  return;
 }
 const consent=await sb.rpc("record_eventour_account_consents",{p_privacy:true,p_terms:true,p_source:"registrazione-demo"});
 if(consent.error){status.textContent="Impossibile registrare il consenso Privacy e Termini. "+consent.error.message;return}
 status.textContent="Email confermata. Demo creata in configurazione. Apertura dashboard…";
 setTimeout(()=>location.replace("dashboard.html"),700);
})();
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();
 const status=document.getElementById("s");
 const company=document.getElementById("company").value.trim();
 const name=document.getElementById("name").value.trim();
 const surname=document.getElementById("surname").value.trim();
 const email=document.getElementById("email").value.trim().toLowerCase();
 const password=document.getElementById("password").value;
 const privacy=document.getElementById("privacy").checked;
 const terms=document.getElementById("terms").checked;
 if(!company||!name||!surname||!email||password.length<12||password.length>72||!privacy||!terms){
  status.textContent="Completa tutti i campi, usa una password di almeno 12 caratteri e accetta Privacy e Termini.";
  return;
 }
 status.textContent="Creazione della demo…";
 const r=await sb.auth.signUp({email,password,options:{
  emailRedirectTo:new URL("registrazione-demo.html?complete=1",location.href).href,
  data:{
   account_type:"societa_demo",nome:name,cognome:surname,ragione_sociale:company,nome_app:company,
   privacy_accettata:"true",termini_accettati:"true",
   privacy_version:"eventour-privacy-2026-11-25",terms_version:"eventour-terms-2026-11-25",
   consent_source:"registrazione-demo",demo_days:14,richiesta_at:new Date().toISOString()
  }
 }});
 if(r.error){status.textContent="Registrazione non completata: "+r.error.message;return}
 status.textContent=r.data.session?"Demo creata in configurazione. Apertura dashboard…":"Account creato. Conferma l’email: dopo la conferma si aprirà la dashboard.";
 if(r.data.session){
  const consent=await sb.rpc("record_eventour_account_consents",{p_privacy:privacy,p_terms:terms,p_source:"registrazione-demo"});
  if(consent.error){await sb.auth.signOut();status.textContent="Impossibile registrare il consenso Privacy e Termini. "+consent.error.message;return}
  setTimeout(()=>location.href="dashboard.html",700);
 }
});
</script><script src="site-navigation-v1.js?v=7"></script>
<script>(function isolateNewsEventourLogo(){const logo=document.querySelector(".news-eventour-logo");if(!logo)return;function isolate(){if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;logo.dataset.textIsolated="1";try{const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png")}catch(e){console.warn("Trattamento logo Eventour non riuscito:",e)}}if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true})})();</script></body></html>
