<script>

const status =

async function salvaPassword(){


const password =
document
.getElementById("password")
.value;


const conferma =
document
.getElementById("conferma")
.value;



if(!password || !conferma){

}



if(password !== conferma){


status.innerHTML=
"Le password non coincidono";

}



if(password.length < 6){


status.innerHTML=
"La password deve avere almeno 6 caratteri";


return;


}



status.innerHTML=
"Aggiornamento password in corso...";



const {

error

}

=

await sb.auth.updateUser({

password:password

});



if(error){


console.error(
"Errore reset password:",
error
);


status.innerHTML=
"Errore: "+error.message;


return;


}



status.innerHTML=
"✅ Password aggiornata correttamente";


setTimeout(()=>{
