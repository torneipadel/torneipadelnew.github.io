<script>
const params = new URLSearchParams(window.location.search);
const isVisitor = params.get("flow") === "visitor";
const companySlug = params.get("azienda") || "";
const sb = supabase.createClient(
  "https://dkeqicstprvvfebiaooc.supabase.co",
  "sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu",
  {
    auth: {
      ...(isVisitor ? { storageKey: "eventour-visitor-auth" } : {}),
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false
    }
  }
);

const status = document.getElementById("status");
let recoveryReady = false;
let recoveryInitPromise;

function setRecoveryStatus(message) {
  status.textContent = message;
}

async function inizializzaSessioneRecupero() {
  try {
    // PKCE: il link contiene ?code=...
    const code = params.get("code");
    if (code) {
      const { data, error } = await sb.auth.exchangeCodeForSession(code);
      if (error) throw error;
      if (data.session) recoveryReady = true;
      params.delete("code");
      const cleanUrl = new URL(window.location.href);
      cleanUrl.search = params.toString();
      window.history.replaceState({}, document.title, cleanUrl.toString());
    } else {
      // Implicit flow: Supabase restituisce i token nel fragment URL.
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const access_token = hash.get("access_token");
      const refresh_token = hash.get("refresh_token");
      if (access_token && refresh_token) {
        const { data, error } = await sb.auth.setSession({ access_token, refresh_token });
        if (error) throw error;
        if (data.session) recoveryReady = true;
        window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
      } else {
        // Alcuni template inviano token_hash e type=recovery.
        const token_hash = params.get("token_hash");
        const type = params.get("type");
        if (token_hash && type === "recovery") {
          const { data, error } = await sb.auth.verifyOtp({ token_hash, type: "recovery" });
          if (error) throw error;
          if (data.session) recoveryReady = true;
        }
      }
    }

    if (!recoveryReady) {
      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      recoveryReady = !!data.session;
    }

    if (recoveryReady) setRecoveryStatus("Link di recupero verificato. Inserisci la nuova password.");
    else setRecoveryStatus("Link non verificato o scaduto. Richiedi un nuovo link di recupero.");
  } catch (error) {
    console.error("Verifica link recupero:", error);
    setRecoveryStatus("Link di recupero non valido o scaduto. Richiedi un nuovo link.");
  }
}
recoveryInitPromise = inizializzaSessioneRecupero();

async function salvaPassword() {
  const password = document.getElementById("password").value;
  const conferma = document.getElementById("conferma").value;

  if (!password || !conferma) {
    setRecoveryStatus("Inserisci entrambe le password");
    return;
  }
  if (password !== conferma) {
    setRecoveryStatus("Le password non coincidono");
    return;
  }
  if (password.length < 12 || password.length > 72) {
    setRecoveryStatus("La password deve contenere almeno 12 caratteri e non superare 72 caratteri.");
    return;
  }

  setRecoveryStatus("Verifica del link e aggiornamento password...");
  await recoveryInitPromise;

  const { data: sessionData, error: sessionError } = await sb.auth.getSession();
  if (sessionError || !sessionData.session) {
    console.error("Sessione recupero assente:", sessionError);
    setRecoveryStatus("Sessione di recupero assente o scaduta. Richiedi un nuovo link e aprilo nello stesso browser.");
    return;
  }

  const { error } = await sb.auth.updateUser({ password });
  if (error) {
    console.error("Errore reset password:", error);
    setRecoveryStatus("Errore: " + error.message);
    return;
  }

  const { error: logoutError } = await sb.auth.signOut({ scope: "global" });
  if (logoutError) await sb.auth.signOut({ scope: "local" });
  setRecoveryStatus("Password aggiornata. Per sicurezza, accedi nuovamente con la nuova password.");
  setTimeout(() => {
    const destination = isVisitor && companySlug
      ? "login-utente.html?azienda=" + encodeURIComponent(companySlug)
      : (isVisitor ? "index.html" : "login.html");
    window.location.href = destination;
  }, 2000);
}
</script>


<script>(function isolateNewsEventourLogo(){const logo=document.querySelector(".news-eventour-logo");if(!logo)return;function isolate(){if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;logo.dataset.textIsolated="1";try{const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png")}catch(e){console.warn("Trattamento logo Eventour non riuscito:",e)}}if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true})})();</script>
