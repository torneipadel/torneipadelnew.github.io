.glass{position:relative;width:min(570px,100%);min-height:640px;margin:0 auto;padding:42px 46px 28px;border:1px solid rgba(255,255,255,.24);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.155),rgba(255,255,255,.065));box-shadow:0 24px 65px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}

.glass:after{content:"";position:absolute;width:260px;height:260px;right:-155px;bottom:-170px;border-radius:50%;background:rgba(255,255,255,.055);filter:blur(10px);pointer-events:none}.glass>*{position:relative;z-index:1}
.brand{position:relative;text-align:center;margin-bottom:27px;padding-bottom:20px;isolation:isolate}
.brand:before{content:"";position:absolute;z-index:-1;left:50%;top:-10px;width:min(390px,92vw);height:205px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,.34) 38%,rgba(0,0,0,.13) 63%,transparent 78%);filter:blur(11px);pointer-events:none}
.brand:after{content:"";position:absolute;left:50%;bottom:0;width:74px;height:1px;transform:translateX(-50%);background:rgba(255,255,255,.35);box-shadow:0 0 12px rgba(255,255,255,.12)}
.brand img{position:relative;z-index:1;display:block;width:auto;max-width:300px;height:auto;max-height:155px;margin:0 auto 13px;object-fit:contain;filter:brightness(1.24) contrast(.90) saturate(.82) drop-shadow(0 0 8px rgba(255,255,255,.18)) drop-shadow(0 10px 24px rgba(0,0,0,.24));opacity:.98;transition:filter .25s ease,transform .25s ease}
.brand img:hover{filter:brightness(1.30) contrast(.88) saturate(.78) drop-shadow(0 0 11px rgba(255,255,255,.25)) drop-shadow(0 12px 28px rgba(0,0,0,.18));transform:translateY(-1px)}
.brand h1{position:relative;z-index:1;margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:2.5px;text-shadow:0 2px 14px rgba(0,0,0,.34)}
.brand p{position:relative;z-index:1;margin:9px 0 0;font-size:13px;line-height:1.5;opacity:.82;letter-spacing:.18px}
.section-title{margin:0 0 20px;font-size:19px;line-height:1.3;font-weight:600;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.24)}.section-title:after{content:"";display:block;width:32px;height:2px;margin:9px auto 0;border-radius:2px;background:rgba(255,255,255,.32)}
label{display:block;margin:0 0 7px;font-size:13px;line-height:1.4;font-weight:600}.field{margin-bottom:16px}
input[type=email],input[type=password]{width:100%;height:49px;padding:0 16px;border:1px solid rgba(255,255,255,.25);border-radius:12px;outline:none;color:#fff;background:rgba(255,255,255,.095);box-shadow:inset 0 1px 1px rgba(255,255,255,.055),0 5px 16px rgba(0,0,0,.05);font:400 15px/1.2 "Open Sans",Arial,sans-serif;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease,transform .2s ease}
input::placeholder{color:rgba(255,255,255,.62)}input:focus{border-color:rgba(255,255,255,.62);background:rgba(255,255,255,.145);box-shadow:0 0 0 3px rgba(255,255,255,.07),0 7px 18px rgba(0,0,0,.07);transform:translateY(-1px)}
.options{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 20px;padding:0 2px;font-size:12.5px;line-height:1.4}.remember{display:flex;align-items:center;gap:7px;margin:0;cursor:pointer}.remember input{width:auto;height:auto;margin:0;accent-color:#fff}
.link{color:#fff;text-decoration:underline;cursor:pointer;font-weight:600;text-underline-offset:2px;text-decoration-color:rgba(255,255,255,.72)}.link:hover{text-decoration-color:#fff}
button{width:100%;height:49px;border:1px solid rgba(255,255,255,.30);border-radius:12px;color:#073b72;font:800 13px/1.2 "Open Sans",Arial,sans-serif;letter-spacing:.65px;cursor:pointer;background:linear-gradient(180deg,#fff,#edf3f6);transition:.2s ease;box-shadow:0 8px 20px rgba(0,0,0,.13)}
button:hover{background:#fff;transform:translateY(-1px);box-shadow:0 11px 25px rgba(0,0,0,.18)}button:active{transform:translateY(0);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.secondary{margin-top:10px;background:rgba(5,17,24,.22);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.06)}.secondary:hover{background:rgba(5,17,24,.34)}

.status{min-height:20px;margin-top:13px;text-align:center;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.88)}

.login-footer a{color:rgba(255,255,255,.86);text-decoration:none;margin:0 7px;transition:color .18s ease}
.login-footer a:hover{color:#fff;text-decoration:underline;text-underline-offset:2px}.login-footer a:focus-visible,.link:focus-visible,.language-button:focus-visible,.language-option:focus-visible,button:focus-visible{outline:2px solid rgba(255,255,255,.78);outline-offset:3px}
.language-selector{position:fixed;top:18px;right:18px;z-index:1000;font-size:13px}.language-button{height:38px;min-width:76px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:11px;background:rgba(7,18,25,.40);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.20);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:700 13px/1 "Open Sans",Arial,sans-serif;letter-spacing:.2px;cursor:pointer}.language-button:hover{background:rgba(7,18,25,.54);transform:none}.language-menu{position:absolute;right:0;top:44px;width:164px;padding:6px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:rgba(10,24,32,.90);box-shadow:0 14px 34px rgba(0,0,0,.34);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;visibility:hidden;transform:translateY(-5px);transition:.18s ease}.language-selector.open .language-menu{opacity:1;visibility:visible;transform:translateY(0)}.language-option{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:#fff;text-align:left;font:600 13px/1.2 "Open Sans",Arial,sans-serif;cursor:pointer}.language-option:hover,.language-option.active{background:rgba(255,255,255,.12)}
@media(max-width:767px){body{padding:16px 11px;align-items:center}.glass{width:min(570px,100%);min-height:calc(100dvh - 32px);padding:29px 21px 23px;border-radius:20px}.brand{margin-bottom:23px;padding-bottom:18px}.brand:before{top:-5px;width:min(340px,88vw);height:175px}.brand img{max-width:250px;max-height:130px}.brand h1{font-size:20px;letter-spacing:2px}.brand p{font-size:12.5px}.section-title{font-size:18px}label{font-size:13px}input[type=email],input[type=password]{height:47px;font-size:15px}.options{font-size:12.5px}button{height:47px;font-size:13px}.register{font-size:12.5px}.status{font-size:13px}.login-footer{margin-top:16px;padding-top:12px;line-height:1.8}.language-selector{top:12px;right:12px}.language-button{height:36px;min-width:72px}.language-menu{top:42px}}

</style>
