<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrati | Next Point Padel</title><style>body{margin:0;font-family:Arial;background:#f4f6fa}.box{max-width:500px;margin:5vh auto;padding:30px;background:#fff;border-radius:22px;box-shadow:0 12px 30px #0001}h1{color:#073b72}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #d5dbe5;box-sizing:border-box}button{background:#ffe76b;border:0;font-weight:800;cursor:pointer}.msg{margin-top:12px;font-weight:700}a{color:#073b72;font-weight:700}</style></head><body><div class="box"><a id="back">← Torna alla società</a><h1>Registrati</h1><p id="company">Creazione account utente</p><input id="nome" placeholder="Nome"><input id="cognome" placeholder="Cognome"><input id="telefono" placeholder="Telefono"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (minimo 6 caratteri)"><button id="go">CREA ACCOUNT</button><div class="msg" id="msg"></div><p>Hai già un account? <a id="login">ACCEDI</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://dkeqicstprvvfebiaooc.supabase.co","sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu"),p=new URLSearchParams(location.search),azienda=p.get("azienda")||"",q=encodeURIComponent(azienda),msg=document.getElementById("msg");
back.href="societa.html?slug="+q;login.href="login-utente.html?azienda="+q;
async function init(){const r=await sb.rpc("get_public_company",{p_slug:azienda}),c=Array.isArray(r.data)?r.data[0]:r.data;if(c)company.textContent="Stai creando un account per "+(c.nome_app||c.ragione_sociale)+".";}
async function go(){msg.textContent="Creazione account in corso…";const em=email.value.trim(),pw=password.value,n=nome.value.trim(),co=cognome.value.trim(),t=telefono.value.trim();if(!azienda||!n||!co||!em||pw.length<6){msg.textContent="Compila i campi obbligatori e usa almeno 6 caratteri.";return}const r=await sb.auth.signUp({email:em,password:pw,options:{data:{nome:n,cognome:co,telefono:t},emailRedirectTo:location.origin+"/registrazione-utente.html?azienda="+q}});if(r.error){msg.textContent=r.error.message;return}if(r.data.session){const m=await sb.rpc("complete_visitor_membership",{p_azienda_slug:azienda,p_nome:n,p_cognome:co,p_telefono:t});if(m.error){msg.textContent=m.error.message;return}msg.textContent="Registrazione avvenuta con successo.";setTimeout(function(){location.href="societa.html?slug="+q},700);return}msg.textContent="Registrazione completata. Controlla la tua email per confermare l'account, poi accedi da questa società."}
document.getElementById("go").onclick=go;init();
</script></body></html>
