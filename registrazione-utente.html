<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrazione visitatore | Eventour</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--line:rgba(255,255,255,.22);--blue:#073b72}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:#06111f url('sfondo2.jpg') center/cover fixed no-repeat;font-family:'Open Sans',Arial,sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(3,12,24,.30),rgba(3,12,24,.68));pointer-events:none;z-index:-1}
.box{width:min(620px,100%);margin:0 auto;padding:24px 22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.28);text-align:center}
.logo{width:min(300px,94%);height:78px;object-fit:contain;display:block;margin:0 auto 4px}.brand-subtitle{display:block;margin:0 auto 16px;color:#fff;font-size:14px;font-style:italic;font-weight:700;letter-spacing:1.2px;line-height:1.2;text-shadow:0 2px 6px rgba(0,0,0,.7)}
h2{margin:0 0 12px;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.info{font-size:13px;line-height:1.45;color:rgba(255,255,255,.68);margin:0 0 12px}
input,textarea{display:block;width:100%;padding:0 13px;margin:7px 0;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.94);color:#333;font:600 14px 'Open Sans',Arial,sans-serif;height:46px;outline:none}
textarea{height:88px;padding:11px 13px;resize:vertical;min-height:88px}
input::placeholder,textarea::placeholder{color:#777;font-weight:400}
input:focus,textarea:focus{border-color:rgba(255,255,255,.65);box-shadow:0 0 0 2px rgba(255,255,255,.10)}
.btn,.btn-back{display:block;width:100%;min-height:46px;margin:10px 0 0;padding:11px 14px;border:1px solid rgba(255,255,255,.20);border-radius:10px;cursor:pointer;font:800 13px 'Open Sans',Arial,sans-serif;line-height:1.2}
.btn{background:#fff;color:var(--blue)}
.btn-back{background:rgba(0,0,0,.32);color:#fff}
#status{margin-top:12px;min-height:20px;color:#ffeb3b;font-size:13px;line-height:1.4}
a{color:#fff;font-weight:700}
.privacy-note{font-size:11px;line-height:1.55;color:rgba(255,255,255,.68);margin:12px 0 4px}
@media(max-width:767px){body{align-items:flex-start;padding:18px 12px 28px;background-attachment:scroll}.box{width:min(620px,100%);padding:20px 16px;border-radius:16px}.logo{width:92%;height:70px;margin-bottom:4px}.brand-subtitle{font-size:13px;margin-bottom:14px}h2{font-size:20px}.info{font-size:13px}input,textarea{font-size:14px}.btn,.btn-back{font-size:13px}}
@media(max-width:380px){.box{padding:18px 13px}.logo{width:92%;height:64px}.brand-subtitle{font-size:12px;letter-spacing:1px}h2{font-size:19px}input,textarea{height:44px}.btn,.btn-back{min-height:44px}}

/* Marchio Eventour uniforme, identico al riferimento news.html */
.news-brand-banner{position:relative;isolation:isolate;width:100%;height:125px;margin:0 0 16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:url("FOTO_PADEL1.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.30)}
.news-brand-banner:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(3,17,31,.62),rgba(3,17,31,.28),rgba(3,17,31,.58));pointer-events:none}
.news-eventour-logo{position:relative;z-index:1;display:block;width:min(560px,94%);height:78px;max-width:94%;max-height:none;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;filter:none;opacity:1}
.news-brand-subtitle{position:relative;z-index:1;color:#fff;font-family:'Open Sans',Arial,sans-serif;font-size:15px;font-style:italic;font-weight:700;letter-spacing:1.6px;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.7);text-align:center}
@media(max-width:600px){.news-brand-banner{height:112px;margin-bottom:13px;border-radius:19px}.news-eventour-logo{height:70px;width:92%;max-width:92%}.news-brand-subtitle{font-size:13px;letter-spacing:1.2px}}
@media(max-width:390px){.news-brand-banner{height:104px}.news-eventour-logo{height:64px;width:92%;max-width:92%}.news-brand-subtitle{font-size:12px;letter-spacing:1px}}
</style>
<link rel="stylesheet" href="mobile-layout-fixes.css?v=1">
</head>
<body>
<div class="box">
<section class="news-brand-banner" aria-label="EVENTOUR gestione &amp; eventi"><img src="eventour_logo.jpg" class="news-eventour-logo" alt="EVENTOUR"><span class="news-brand-subtitle">gestione eventi &amp; tornei</span></section>
<h2>Registrazione visitatore</h2>
<div class="info" id="company">Caricamento società...</div>

<input id="nome" placeholder="Nome">
<input id="cognome" placeholder="Cognome">
<input id="telefono" placeholder="Telefono">
<input id="livello" placeholder="Livello">
<input id="alias" placeholder="Alias torneo">
<textarea id="note" placeholder="Note"></textarea>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (minimo 6 caratteri)">

<p class="privacy-note">I dati inseriti servono per creare il tuo account e gestire la tua partecipazione alle attività della società. <a href="privacy.html" target="_blank" rel="noopener noreferrer">Leggi l’informativa privacy</a>.</p>

<button class="btn" id="go">CREA ACCOUNT</button>
<button class="btn-back" id="back">⬅ Torna alla società</button>
<div id="status"></div>
<p class="privacy-note">Hai già un account? <a id="login">ACCEDI</a></p>
</div>

<script>
const sb=supabase.createClient(
"https://dkeqicstprvvfebiaooc.supabase.co",
"sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu",
{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
const params=new URLSearchParams(location.search);
const azienda=params.get("azienda")||"";
const q=encodeURIComponent(azienda);
const statusBox=document.getElementById("status");
let companyRecord=null,busy=false;

document.getElementById("back").onclick=()=>{location.href="societa.html?slug="+q};
document.getElementById("login").href="login-utente.html?azienda="+q;

function generaAlias(nome,cognome){
 if(!nome||!cognome)return "";
 return nome.trim().charAt(0)+"."+cognome.trim();
}

async function init(){
 const r=await sb.rpc("get_public_company",{p_slug:azienda});
 const c=Array.isArray(r.data)?r.data[0]:r.data;
 companyRecord=c||null;
 if(r.error||!c||!c.id){
   statusBox.textContent="Società non trovata o non disponibile.";
   document.getElementById("go").disabled=true;
   return;
 }
 document.getElementById("company").textContent="Stai creando un account per "+(c.nome_app||c.ragione_sociale)+".";
}

async function go(){
 if(busy)return;
 busy=true;
 const submitButton=document.getElementById("go");
 submitButton.disabled=true;
 statusBox.textContent="Creazione account in corso…";

 const nome=document.getElementById("nome").value.trim();
 const cognome=document.getElementById("cognome").value.trim();
 const telefono=document.getElementById("telefono").value.trim();
 const livello=document.getElementById("livello").value.trim();
 let alias=document.getElementById("alias").value.trim();
 const note=document.getElementById("note").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!azienda||!companyRecord?.id||!nome||!cognome||!email||password.length<6){
   statusBox.textContent="Verifica la società e compila Nome, Cognome, Email e Password (minimo 6 caratteri).";
   busy=false;submitButton.disabled=false;
   return;
 }
 if(!alias){
   alias=generaAlias(nome,cognome);
   document.getElementById("alias").value=alias;
 }

 const r=await sb.auth.signUp({
   email,
   password,
   options:{
     data:{nome,cognome,telefono,livello,alias,note},
     emailRedirectTo:location.origin+location.pathname+"?azienda="+q
   }
 });
 if(r.error){
   statusBox.textContent=r.error.message;
   busy=false;submitButton.disabled=false;
   return;
 }

 if(r.data.session){
   const m=await sb.rpc("complete_visitor_membership",{
     p_azienda_slug:azienda,
     p_nome:nome,
     p_cognome:cognome,
     p_telefono:telefono
   });
   const member=Array.isArray(m.data)?m.data[0]:m.data;
   if(m.error||!member?.ok||String(member.azienda_id)!==String(companyRecord.id)||String(member.ruolo||"").toLowerCase()!=="user"){
     await sb.auth.signOut();
     statusBox.textContent="Account creato, ma l'associazione alla società non è riuscita o l'account non è un visitatore. Accedi con un account visitatore. "+(m.error?.message||"");
     busy=false;submitButton.disabled=false;
     return;
   }

   const extra=await sb.rpc("update_visitor_profile",{
     p_livello:livello,
     p_alias:alias,
     p_note:note
   });
   if(extra.error){
     await sb.auth.signOut();
     statusBox.textContent="Account creato, ma il profilo non è stato completato. Accedi con le stesse credenziali per riprovare. Dettaglio: "+extra.error.message;
     busy=false;submitButton.disabled=false;
     return;
   }

   sessionStorage.setItem("nextpoint_login_azienda_id",companyRecord.id);
   sessionStorage.setItem("nextpoint_login_azienda_slug",companyRecord.slug);
   sessionStorage.setItem("nextpoint_login_role","user");
   sessionStorage.setItem("nextpoint_public_azienda_slug",companyRecord.slug);
   localStorage.setItem("nextpoint_public_azienda_slug",companyRecord.slug);
   statusBox.textContent="Registrazione avvenuta con successo.";
   window.location.replace("visitatore.html?azienda="+encodeURIComponent(companyRecord.slug));
   return;
 }

 statusBox.textContent="Registrazione completata. Controlla la tua email per confermare l’account, poi accedi da questa società.";
 busy=false;submitButton.disabled=false;
}

document.getElementById("go").onclick=async()=>{try{await go()}catch(e){console.error("Errore registrazione visitatore:",e);statusBox.textContent="Errore di collegamento. Riprova.";busy=false;document.getElementById("go").disabled=false}};
init();
</script>
<script src="site-navigation-v1.js?v=6"></script>
<script>
(function isolateNewsEventourLogo(){const logo=document.querySelector(".news-eventour-logo");if(!logo)return;function isolate(){if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;logo.dataset.textIsolated="1";try{const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png")}catch(e){console.warn("Trattamento logo Eventour non riuscito:",e)}}if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true})})();
</script>
</body>
</html>
