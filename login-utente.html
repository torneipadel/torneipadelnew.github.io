<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi | Eventour</title><style>body{margin:0;font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,rgba(3,12,24,.70),rgba(7,59,114,.40)),url("https://images.pexels.com/photos/32474981/pexels-photo-32474981.jpeg?auto=compress&cs=tinysrgb&w=2400") center center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background-color:#073b72}.box{width:min(460px,100%);box-sizing:border-box;margin:0;padding:32px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%)}h1{margin:14px 0 8px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}.brand-logo{display:block;width:min(300px,94%);height:78px;object-fit:contain;margin:0 auto 4px}.brand-subtitle{text-align:center;margin:0 0 16px;color:#fff;font-size:14px;font-style:italic;font-weight:700;letter-spacing:1.2px;text-shadow:0 2px 6px rgba(0,0,0,.7)}p{color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.3)}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;box-sizing:border-box}input{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.65);color:#073b72;outline:none}input:focus{background:rgba(255,255,255,.9);border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}button{background:#ffe76b;border:0;font-weight:800;cursor:pointer;color:#073b72;box-shadow:0 8px 22px rgba(0,0,0,.2)}.msg{margin-top:12px;font-weight:700}.msg:empty{display:none}a{color:#fff;font-weight:700;text-shadow:0 1px 5px rgba(0,0,0,.3)}#company{font-weight:700}@media(max-width:600px){.box{width:100%;box-sizing:border-box;padding:24px}.brand-logo{height:70px;width:92%}.brand-subtitle{font-size:13px}}</style><link rel="stylesheet" href="mobile-layout-fixes.css?v=1">
</head><body><div class="box"><img src="eventour_logo.jpg" class="brand-logo" alt="EVENTOUR"><div class="brand-subtitle">gestione &amp; eventi</div><a id="back">← Torna alla società</a><h1>Accedi</h1><p id="company">Accesso utente</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="go">ACCEDI</button><div class="msg" id="msg"></div><p>Non hai un account? <a id="reg">REGISTRATI</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://dkeqicstprvvfebiaooc.supabase.co","sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const params=new URLSearchParams(location.search),azienda=params.get("azienda")||"",q=encodeURIComponent(azienda);
const msg=document.getElementById("msg"),goBtn=document.getElementById("go");
let companyRecord=null,busy=false;
document.getElementById("back").href="societa.html?slug="+q;
document.getElementById("reg").href="registrazione-utente.html?azienda="+q;
async function init(){
  if(!azienda){msg.textContent="Società non specificata.";goBtn.disabled=true;return}
  try{
    const r=await sb.rpc("get_public_company",{p_slug:azienda});
    companyRecord=Array.isArray(r.data)?r.data[0]:r.data;
    if(r.error||!companyRecord?.id){msg.textContent="Società non trovata o non disponibile.";goBtn.disabled=true;return}
    document.getElementById("company").textContent="Accesso a "+(companyRecord.nome_app||companyRecord.ragione_sociale);
  }catch(e){msg.textContent="Impossibile verificare la società. Riprova più tardi.";goBtn.disabled=true}
}
async function go(){
  if(busy)return;
  if(!companyRecord?.id){msg.textContent="Società non trovata o non disponibile.";return}
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  if(!email||!password){msg.textContent="Inserisci email e password.";return}
  busy=true;goBtn.disabled=true;msg.textContent="Accesso in corso…";
  try{
    const auth=await sb.auth.signInWithPassword({email,password});
    if(auth.error||!auth.data?.user){msg.textContent=auth.error?.message||"Accesso non riuscito.";return}
    const user=auth.data.user,meta=user.user_metadata||{};
    const membership=await sb.rpc("complete_visitor_membership",{
      p_azienda_slug:companyRecord.slug,
      p_nome:meta.nome||meta.first_name||null,
      p_cognome:meta.cognome||meta.last_name||null,
      p_telefono:meta.telefono||null
    });
    const result=Array.isArray(membership.data)?membership.data[0]:membership.data;
    if(membership.error||!result?.ok||result.azienda_id!==companyRecord.id){
      await sb.auth.signOut();
      msg.textContent=membership.error?.message||"Non è stato possibile verificare l'accesso a questa società.";
      return;
    }
    if(String(result.ruolo||"").toLowerCase()!=="user"){
      await sb.auth.signOut();
      msg.textContent="Questo account non è un account visitatore. Usa l'accesso riservato alla società.";
      return;
    }
    const extra=await sb.rpc("update_visitor_profile",{
      p_livello:meta.livello||null,
      p_alias:meta.alias||null,
      p_note:meta.note||null
    });
    if(extra.error){
      await sb.auth.signOut();
      msg.textContent="Accesso non completato: "+extra.error.message;
      return;
    }
    sessionStorage.setItem("nextpoint_login_azienda_id",companyRecord.id);
    sessionStorage.setItem("nextpoint_login_azienda_slug",companyRecord.slug);
    sessionStorage.setItem("nextpoint_login_role","user");
    sessionStorage.setItem("nextpoint_public_azienda_slug",companyRecord.slug);
    localStorage.setItem("nextpoint_public_azienda_slug",companyRecord.slug);
    window.location.replace("visitatore.html?azienda="+encodeURIComponent(companyRecord.slug));
  }catch(e){
    console.error("Errore accesso visitatore:",e);
    msg.textContent="Errore di collegamento. Riprova.";
  }finally{busy=false;goBtn.disabled=false}
}
goBtn.onclick=go;
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
init();
</script><script src="site-navigation-v1.js?v=1"></script>
</body></html>
