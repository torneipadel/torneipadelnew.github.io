<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi | Eventour</title><style>body{margin:0;font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,rgba(3,12,24,.70),rgba(7,59,114,.40)),url("https://images.pexels.com/photos/32474981/pexels-photo-32474981.jpeg?auto=compress&cs=tinysrgb&w=2400") center center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background-color:#073b72}.box{width:min(460px,100%);box-sizing:border-box;margin:0;padding:32px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%)}h1{margin:14px 0 8px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}.brand-logo{display:block;width:min(300px,94%);height:78px;object-fit:contain;margin:0 auto 4px}.brand-subtitle{text-align:center;margin:0 0 16px;color:#fff;font-size:14px;font-style:italic;font-weight:700;letter-spacing:1.2px;text-shadow:0 2px 6px rgba(0,0,0,.7)}p{color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.3)}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;box-sizing:border-box}input{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.65);color:#073b72;outline:none}input:focus{background:rgba(255,255,255,.9);border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}button{background:#ffe76b;border:0;font-weight:800;cursor:pointer;color:#073b72;box-shadow:0 8px 22px rgba(0,0,0,.2)}.msg{margin-top:12px;font-weight:700}.msg:empty{display:none}a{color:#fff;font-weight:700;text-shadow:0 1px 5px rgba(0,0,0,.3)}#company{font-weight:700}@media(max-width:600px){.box{width:100%;box-sizing:border-box;padding:24px}.brand-logo{height:70px;width:92%}.brand-subtitle{font-size:13px}}
/* Marchio Eventour uniforme, identico al riferimento news.html */
.news-brand-banner{position:relative;isolation:isolate;width:100%;height:125px;margin:0 0 16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:url("FOTO_PADEL1.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.30)}
.news-brand-banner:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(3,17,31,.62),rgba(3,17,31,.28),rgba(3,17,31,.58));pointer-events:none}
.news-eventour-logo{position:relative;z-index:1;display:block;width:min(560px,94%);height:78px;max-width:94%;max-height:none;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;filter:none;opacity:1}

</style><link rel="stylesheet" href="mobile-layout-fixes.css?v=1">
</head><body><div class="box"><section class="news-brand-banner" aria-label="EVENTOUR gestione &amp; eventi"><img src="eventour_logo.jpg" class="news-eventour-logo" alt="EVENTOUR"><span class="news-brand-subtitle">gestione eventi &amp; tornei</span></section><a id="back">← Torna alla società</a><h1>Accedi</h1><p id="company">Accesso utente</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="go">ACCEDI</button><div class="msg" id="msg"></div><p>Non hai un account? <a id="reg">REGISTRATI</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://dkeqicstprvvfebiaooc.supabase.co","sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const params=new URLSearchParams(location.search),azienda=params.get("azienda")||"",q=encodeURIComponent(azienda);
const msg=document.getElementById("msg"),goBtn=document.getElementById("go");
let companyRecord=null,busy=false;
document.getElementById("back").href="societa.html?slug="+q;
document.getElementById("reg").href="registrazione-utente.html?azienda="+q;
async function init(){
  if(!azienda){msg.textContent="Società non specificata.";goBtn.disabled=true;return}
  try{
    const r=await sb.rpc("get_public_company",{p_slug:azienda});
    companyRecord=Array.isArray(r.data)?r.data[0]:r.data;
    if(r.error||!companyRecord?.id){msg.textContent="Società non trovata o non disponibile.";goBtn.disabled=true;return}
    document.getElementById("company").textContent="Accesso a "+(companyRecord.nome_app||companyRecord.ragione_sociale);
  }catch(e){msg.textContent="Impossibile verificare la società. Riprova più tardi.";goBtn.disabled=true}
}
async function go(){
  if(busy)return;
  if(!companyRecord?.id){msg.textContent="Società non trovata o non disponibile.";return}
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  if(!email||!password){msg.textContent="Inserisci email e password.";return}
  busy=true;goBtn.disabled=true;msg.textContent="Accesso in corso…";
  try{
    const auth=await sb.auth.signInWithPassword({email,password});
    if(auth.error||!auth.data?.user){msg.textContent=auth.error?.message||"Accesso non riuscito.";return}
    const user=auth.data.user,meta=user.user_metadata||{};
    const membership=await sb.rpc("complete_visitor_membership",{
      p_azienda_slug:companyRecord.slug,
      p_nome:meta.nome||meta.first_name||null,
      p_cognome:meta.cognome||meta.last_name||null,
      p_telefono:meta.telefono||null
    });
    const result=Array.isArray(membership.data)?membership.data[0]:membership.data;
    if(membership.error||!result?.ok||result.azienda_id!==companyRecord.id){
      await sb.auth.signOut();
      msg.textContent=membership.error?.message||"Non è stato possibile verificare l'accesso a questa società.";
      return;
    }
    const ruoloAccesso=String(result.ruolo||"").toLowerCase();
    const ruoliAmmessi=["user","owner","admin","superadmin"];
    if(!ruoliAmmessi.includes(ruoloAccesso)){
      await sb.auth.signOut();
      msg.textContent="Questo account non è autorizzato ad accedere ai tornei di questa società.";
      return;
    }
    // Il profilo visitatore è aggiornabile solo per gli account user.
    // Gli amministratori mantengono il proprio ruolo e accedono alla pagina pubblica senza essere disconnessi.
    if(ruoloAccesso==="user"){
      const extra=await sb.rpc("update_visitor_profile",{
        p_livello:meta.livello||null,
        p_alias:meta.alias||null,
        p_note:meta.note||null
      });
      if(extra.error){
        console.error("Aggiornamento profilo visitatore non riuscito:",extra.error);
      }
    }
    sessionStorage.setItem("nextpoint_login_azienda_id",companyRecord.id);
    sessionStorage.setItem("nextpoint_login_azienda_slug",companyRecord.slug);
    sessionStorage.setItem("nextpoint_login_role","user");
    sessionStorage.setItem("nextpoint_public_azienda_slug",companyRecord.slug);
    localStorage.setItem("nextpoint_public_azienda_slug",companyRecord.slug);
    window.location.replace("visitatore.html?azienda="+encodeURIComponent(companyRecord.slug));
  }catch(e){
    console.error("Errore accesso visitatore:",e);
    msg.textContent="Errore di collegamento. Riprova.";
  }finally{busy=false;goBtn.disabled=false}
}
goBtn.onclick=go;
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
init();
</script><script src="site-navigation-v1.js?v=1"></script>
<script>
(function isolateNewsEventourLogo(){const logo=document.querySelector(".news-eventour-logo");if(!logo)return;function isolate(){if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;logo.dataset.textIsolated="1";try{const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png")}catch(e){console.warn("Trattamento logo Eventour non riuscito:",e)}}if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true})})();
</script>
</body></html>
