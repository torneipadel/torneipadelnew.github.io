<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Desktop Test</title>
<style>
html,body{margin:0;min-height:100%;background:#070b11;color:#fff;font-family:Arial,sans-serif}
#loader{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;background:#070b11;font-size:18px}
</style>
</head>
<body>
<div id="loader">Caricamento Admin Desktop…</div>
<script>
(async()=>{
  try{
    const response=await fetch('admin.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Impossibile caricare admin.html: HTTP '+response.status);
    let html=await response.text();

    const desktopScript=`
<script>
(function(){
  let applicato=false;

  function applicaDesktop(){
    if(applicato)return;

    const area=document.getElementById('areaAdmin');
    if(!area || area.classList.contains('hidden')) return;

    const direct=[...area.children];
    const title=direct.find(e=>e.tagName==='H1');
    const details=direct.filter(e=>e.tagName==='DETAILS');
    const gestione=document.getElementById('gestioneTorneoAdmin');

    if(!title || details.length<4 || !gestione) return;

    applicato=true;

    const nuovo=details[0];
    const tornei=details[1];
    const news=details[2];
    const sponsor=details[3];

    nuovo.id='desktopNuovoTorneo';
    tornei.id='desktopTornei';
    news.id='desktopNews';
    sponsor.id='desktopSponsor';

    const style=document.createElement('style');
    style.id='adminDesktopFinalTestStyle';
    style.textContent=\`
      html,body{background:#070b11!important;color:#eef3f8!important;overflow-x:hidden!important}
      body{padding:0!important;margin:0!important;min-height:100vh!important}
      .btn-indietro{display:none!important}
      .container{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
      #areaAdmin{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;display:grid!important;grid-template-columns:240px minmax(0,1fr)!important;grid-template-rows:68px minmax(0,1fr)!important;min-height:100vh!important;background:#070b11!important}
      #areaAdmin>h1{display:none!important}
      #adminDesktopSidebar{grid-column:1!important;grid-row:1 / 3!important;background:#0d131c!important;border-right:1px solid #293646!important;padding:20px 14px!important;display:flex!important;flex-direction:column!important;gap:7px!important}
      #adminDesktopBrand{padding:3px 8px 20px!important;margin-bottom:10px!important;border-bottom:1px solid #293646!important;font-weight:800!important;letter-spacing:1px!important}
      #adminDesktopBrand small{display:block!important;color:#7f8b9a!important;font-size:10px!important;letter-spacing:0!important;margin-top:4px!important}
      .adminDesktopNavBtn{width:100%!important;margin:0!important;padding:12px!important;border:1px solid transparent!important;border-radius:9px!important;background:transparent!important;color:#cbd5e1!important;text-align:left!important;font-weight:700!important;cursor:pointer!important}
      .adminDesktopNavBtn:hover,.adminDesktopNavBtn.active{background:#1b2735!important;border-color:#344456!important;color:#fff!important}
      #adminDesktopTopbar{grid-column:2!important;grid-row:1!important;background:#0d131c!important;border-bottom:1px solid #293646!important;padding:0 22px!important;display:flex!important;align-items:center!important;justify-content:space-between!important}
      #adminDesktopTopbar strong{font-size:16px!important}
      #adminDesktopTopbar span{display:block!important;color:#7f8b9a!important;font-size:11px!important;margin-top:4px!important}
      #adminDesktopWorkspace{grid-column:2!important;grid-row:2!important;min-width:0!important;padding:22px!important;overflow:auto!important}
      #adminDesktopWorkspace>details,#adminDesktopWorkspace>#gestioneTorneoAdmin{max-width:1200px!important;margin:0 auto 14px!important;background:#111923!important;border:1px solid #293646!important;border-radius:12px!important;padding:14px!important;box-shadow:0 8px 30px rgba(0,0,0,.25)!important}
      #adminDesktopWorkspace summary{color:#fff!important;font-weight:800!important;cursor:pointer!important}
      #adminDesktopWorkspace input,#adminDesktopWorkspace select,#adminDesktopWorkspace textarea{background:#0a1017!important;color:#fff!important;border:1px solid #303d4c!important;border-radius:8px!important}
      #adminDesktopWorkspace button{border-radius:8px!important}
      @media(max-width:850px){#areaAdmin{display:block!important}#adminDesktopSidebar{border-right:0!important;border-bottom:1px solid #293646!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}#adminDesktopTopbar{height:64px!important}#adminDesktopWorkspace{padding:12px!important}}
    \`;
    document.head.appendChild(style);

    const sidebar=document.createElement('aside');
    sidebar.id='adminDesktopSidebar';
    sidebar.innerHTML='<div id="adminDesktopBrand">🎾 ADMIN<small>PADEL MANAGER</small></div>';

    const topbar=document.createElement('header');
    topbar.id='adminDesktopTopbar';
    topbar.innerHTML='<div><strong>Gestione amministrazione</strong><span>Configurazione e gestione tornei</span></div>';

    const workspace=document.createElement('main');
    workspace.id='adminDesktopWorkspace';

    function addNav(icon,label,target){
      const b=document.createElement('button');
      b.type='button';
      b.className='adminDesktopNavBtn';
      b.textContent=icon+' '+label;
      b.onclick=()=>{
        document.querySelectorAll('.adminDesktopNavBtn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        const el=document.getElementById(target);
        if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}
      };
      sidebar.appendChild(b);
      return b;
    }

    const b1=addNav('➕','Nuovo torneo','desktopNuovoTorneo');
    addNav('📋','Tornei creati','desktopTornei');
    addNav('👥','Gestione torneo','gestioneTorneoAdmin');
    addNav('📰','News','desktopNews');
    addNav('🏆','Sponsor','desktopSponsor');
    b1.classList.add('active');

    area.innerHTML='';
    area.appendChild(sidebar);
    area.appendChild(topbar);
    area.appendChild(workspace);

    workspace.appendChild(nuovo);
    workspace.appendChild(tornei);
    workspace.appendChild(gestione);
    workspace.appendChild(news);
    workspace.appendChild(sponsor);

    console.log('======================================');
    console.log('✅ ADMIN DESKTOP TEST REALE');
    console.log('Funzioni originali: INVARIATE');
    console.log('admin.html originale: INVARIATO');
    console.log('Nuovo layout: APPLICATO');
    console.log('======================================');
  }

  const observer=new MutationObserver(applicaDesktop);
  observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  document.addEventListener('DOMContentLoaded',applicaDesktop);
  setTimeout(applicaDesktop,300);
  setTimeout(applicaDesktop,1000);
  setTimeout(applicaDesktop,2500);
})();
<\/script>`;

    html=html.replace('</body>',desktopScript+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loader').textContent='❌ '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
