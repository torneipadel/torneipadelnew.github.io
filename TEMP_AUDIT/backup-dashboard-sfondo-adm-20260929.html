<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Next Point Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#073b72;--gold:#ffe76b;--glass:rgba(255,255,255,.12);--border:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Open Sans',Arial,sans-serif;color:#fff}
body{background:linear-gradient(rgba(3,12,24,.24),rgba(3,12,24,.60)),url('https://ueeshop.ly200-cdn.com/u_file/UPAX/UPAX890/2307/photo/4fae8cc612.jpg') center/cover fixed no-repeat;min-height:100vh;padding:22px 16px 40px;overflow-x:hidden}
.exit-public{position:fixed;top:18px;left:18px;width:30px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font:16px/1 'Open Sans',Arial,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000;opacity:.78}.exit-public:hover{opacity:1;background:rgba(255,255,255,.14)}.page{width:min(760px,100%);margin:0 auto}
.hero{position:relative;isolation:isolate;padding:34px 26px 28px;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.055));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.23);box-shadow:0 16px 45px rgba(0,0,0,.28);text-align:center;overflow:hidden}
.hero:before{content:"";position:absolute;z-index:-1;left:50%;top:-28px;width:min(470px,88vw);height:245px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.52) 0%,rgba(0,0,0,.34) 38%,rgba(0,0,0,.14) 62%,rgba(0,0,0,0) 78%);filter:blur(11px);pointer-events:none}
.logo{position:relative;z-index:1;display:block;width:auto;max-width:300px;height:auto;max-height:155px;margin:0 auto 12px;object-fit:contain;filter:brightness(1.24) contrast(.90) saturate(.82) drop-shadow(0 0 8px rgba(255,255,255,.18)) drop-shadow(0 10px 24px rgba(0,0,0,.22));opacity:.98;transition:filter .25s ease,transform .25s ease}
.logo:hover{filter:brightness(1.30) contrast(.88) saturate(.78) drop-shadow(0 0 11px rgba(255,255,255,.25)) drop-shadow(0 12px 28px rgba(0,0,0,.18));transform:translateY(-1px)}
.eyebrow{position:relative;z-index:1;font-size:10px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:8px}
h1{position:relative;z-index:1;font-size:29px;line-height:1.12;margin:0;font-weight:800;letter-spacing:-.03em;text-shadow:0 3px 14px rgba(0,0,0,.18)}
.welcome-name{position:relative;z-index:1;font-size:16px;line-height:1.4;margin:9px 0 0;font-weight:600;color:rgba(255,255,255,.90)}
.email{position:relative;z-index:1;font-size:12px;line-height:1.4;margin:4px 0 0;color:rgba(255,255,255,.56)}
.subtitle{position:relative;z-index:1;max-width:520px;margin:17px auto 0;font-size:14px;line-height:1.55;color:rgba(255,255,255,.78)}
.main-actions{display:flex;justify-content:center;align-items:stretch;gap:11px;margin-top:24px}.main-actions .action{width:220px}
.action{min-height:92px;border:1px solid rgba(255,255,255,.18);border-radius:15px;background:rgba(255,255,255,.10);color:#fff;padding:15px 10px;cursor:pointer;text-align:center;font-family:'Open Sans',Arial,sans-serif;transition:.2s;box-shadow:0 6px 18px rgba(0,0,0,.10)}
