r.ok||!d?.ok||d?.azienda?.id!==c.id){out.textContent=d?.error||"Partita IVA / Codice Fiscale non valido per questa società.";return}step2.style.display="block";submit.textContent="ACCEDI";out.textContent="Società identificata. Inserisci email e password.";email.focus();return}out.textContent="Accesso in corso…";const r=await sb.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:pass.value});if(r.error||!r.data?.session){out.textContent=r.error?.message||"Credenziali non valide.";return}const a=await sb.rpc("get_my_azienda_access",{p_azienda_id:c.id});const rows=Array.isArray(a.data)?a.data:[],access=rows.find(x=>x.azienda_id===c.id),role=String(access?.ruolo||"").toLowerCase();if(a.error||!access||!access.accesso_consentito||!["admin","superadmin"].includes(role)){await sb.auth.signOut();out.textContent="Accesso negato: l'account non è amministratore di questa società.";return}sessionStorage.setItem("nextpoint_login_azienda_id",c.id);sessionStorage.setItem("nextpoint_login_role",role);sessionStorage.setItem("nextpoint_login_azienda_slug",c.slug);location.href="dashboard.html?azienda="+encodeURIComponent(c.slug)};}load();</script></body></html>
