<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso riservato alla società</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#071219,#073b72);color:#fff}.box{width:min(470px,100%);padding:32px;border-radius:22px;background:#ffffff12;border:1px solid #ffffff35;box-shadow:0 20px 60px #0005}h1{margin:0 0 8px;font-size:26px}p{color:#dbe4ec;line-height:1.5}label{display:block;margin:16px 0 7px;font-weight:700;font-size:13px}input{width:100%;height:49px;padding:0 13px;box-sizing:border-box;border:1px solid #ffffff40;border-radius:10px;background:#ffffff12;color:#fff;font-size:15px}button{width:100%;height:49px;margin-top:18px;border:0;border-radius:10px;background:#fff;color:#073b72;font-weight:800;cursor:pointer}.back{background:#ffffff12;color:#fff;border:1px solid #ffffff35}.badge{text-align:center;color:#ffe76b;font-size:12px;font-weight:800;letter-spacing:.12em;margin-bottom:16px}.msg{min-height:22px;margin-top:14px;text-align:center;font-size:13px}</style></head><body><main class="box"><div class="badge">ACCESSO RISERVATO ALLA SOCIETÀ</div><h1 id="title">Accesso amministrativo</h1><p id="company">Caricamento società…</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">ACCEDI</button></form><button class="back" id="back" type="button">← TORNA ALLA SOCIETÀ</button><div class="msg" id="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://dkeqicstprvvfebiaooc.supabase.co","sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu",{auth:{persistSession:true,autoRefreshToken:true}}),p=new URLSearchParams(location.search),slug=p.get("azienda")||"",msg=document.getElementById("msg"),company=document.getElementById("company");let companyId="";function say(x){msg.textContent=x||""}async function init(){if(!slug){company.textContent="Società non specificata.";return}const r=await sb.rpc("get_public_company",{p_slug:slug}),c=Array.isArray(r.data)?r.data[0]:r.data;if(r.error||!c){company.textContent="Società non trovata o non disponibile.";return}companyId=c.id;company.textContent="Accesso amministrativo a "+(c.nome_app||c.ragione_sociale);document.getElementById("back").onclick=()=>location.href="societa.html?slug="+encodeURIComponent(slug)}async function login(e){e.preventDefault();say("Accesso in corso…");const r=await sb.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});if(r.error||!r.data?.session){say(r.error?.message||"Credenziali non valide.");return}if(!companyId){await sb.auth.signOut();say("Società non identificata.");return}const a=await sb.rpc("get_my_azienda_access",{p_azienda_id:companyId});if(a.error){await sb.auth.signOut();say("Errore nella verifica dei permessi della società.");return}const rows=Array.isArray(a.data)?a.data:[];const access=rows.find(x=>x.azienda_id===companyId);const role=String(access?.ruolo||"").toLowerCase();if(!access||!access.accesso_consentito||!['admin','superadmin'].includes(role)){await sb.auth.signOut();say("Accesso negato: l'account non è amministratore di questa società.");return}sessionStorage.setItem("nextpoint_login_azienda_id",companyId);sessionStorage.setItem("nextpoint_login_role",role);sessionStorage.setItem("nextpoint_login_azienda_slug",slug);location.href="dashboard.html?azienda="+encodeURIComponent(slug)}document.getElementById("form").addEventListener("submit",login);init();</script></body></html>
