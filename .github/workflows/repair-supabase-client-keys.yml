name: Repair Supabase client keys

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align public clients to MASTER key
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          login = Path("login.html").read_text(encoding="utf-8")
          m = re.search(r'createClient\("https://dkeqicstprvvfebiaooc\.supabase\.co","([^"]+)"', login)
          if not m:
              raise SystemExit("MASTER client key not found in login.html")
          valid_key = m.group(1)

          files = [
              "torneo-flow-public-fix-v1.js",
              "visitatore-public-v2.js",
              "mercatino-public-v1.js",
              "tv-mode-v1.js",
              "visitatore-eventi-v1.js",
          ]

          changed = []
          for name in files:
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              new = re.sub(
                  r'(const\s+(?:KEY|SUPABASE_KEY)\s*=\s*['"])[^'"]+(['"])',
                  lambda m: m.group(1) + valid_key + m.group(2),
                  s
              )
              if new != s:
                  p.write_text(new, encoding="utf-8")
                  changed.append(name)

          print("Changed:", changed)
          if len(changed) != len(files):
              raise SystemExit("Not all five target files were changed")
          PY

      - name: Commit repaired clients
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torneo-flow-public-fix-v1.js visitatore-public-v2.js mercatino-public-v1.js tv-mode-v1.js visitatore-eventi-v1.js
          git commit -m "Fix MASTER Supabase client keys" || exit 0
          git push
