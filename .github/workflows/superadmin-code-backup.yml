name: Superadmin code backup and restore

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: superadmin-code-backup-restore
  cancel-in-progress: false

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('torneipadel-code-backup-bridge');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Check pending restore request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dkeqicstprvvfebiaooc.supabase.co/functions/v1/code-backup-bridge"
          RESP="$(curl -fsS -H "Authorization: Bearer $BRIDGE_TOKEN" "$URL")"
          echo "$RESP"
          PENDING="$(python -c 'import json,sys; print(str(json.load(sys.stdin).get("pending",False)).lower())' <<< "$RESP")"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          if [ "$PENDING" != "true" ]; then exit 0; fi
          python -c 'import json,sys; d=json.load(sys.stdin)["request"]; print(d["id"]); print(d["file_path"]); print(d["commit_sha"])' <<< "$RESP" > /tmp/request.txt
          {
            echo "id=$(sed -n '1p' /tmp/request.txt)"
            echo "file=$(sed -n '2p' /tmp/request.txt)"
            echo "sha=$(sed -n '3p' /tmp/request.txt)"
          } >> "$GITHUB_OUTPUT"
        env:
          BRIDGE_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Create and register daily complete repository backup
        if: github.event_name == 'schedule' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(date -u +%Y%m%d)"
          BRANCH="backup-completo-$DAY"
          EXISTING_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | awk 'NR==1 {print $1}')"
          if [ -z "$EXISTING_SHA" ]; then
            git branch "$BRANCH" "$GITHUB_SHA"
            git push origin "$BRANCH"
            BACKUP_SHA="$GITHUB_SHA"
          else
            BACKUP_SHA="$EXISTING_SHA"
          fi
          export BACKUP_BRANCH="$BRANCH"
          export BACKUP_SHA
          python -c 'import json,os; print(json.dumps({"operation":"register_backup","branch_name":os.environ["BACKUP_BRANCH"],"commit_sha":os.environ["BACKUP_SHA"]}))' > /tmp/backup.json
          curl -fsS -X POST "https://dkeqicstprvvfebiaooc.supabase.co/functions/v1/code-backup-bridge" \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/backup.json
        env:
          BRIDGE_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Validate restore request
        if: steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RESTORE_FILE"
          SHA="$RESTORE_SHA"
          case "$FILE" in
            tabellone.html|admin-tenant-isolation-v1.js|admin-approval-sync-v1.js|admin.html|admin-superadmin-v1.js|manuale.html|admin-system-monitor-v1.js|admin-torneo-rotazione-v1.js|index.html|superadmin-login.html|eventour-control-center.html|eventour-control-center-v1.js|eventour-control-center-v1.css|eventour-control-center-entry-v1.js) ;;
            *) echo "File non autorizzato: $FILE"; exit 1 ;;
          esac
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "SHA non valido"; exit 1; }
          git cat-file -e "$SHA^{commit}"
        env:
          RESTORE_FILE: ${{ steps.request.outputs.file }}
          RESTORE_SHA: ${{ steps.request.outputs.sha }}

      - name: Restore complete file from selected commit
        if: steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RESTORE_FILE"
          SHA="$RESTORE_SHA"
          git restore --source "$SHA" -- "$FILE"
          git diff --quiet -- "$FILE" && { echo "Il file è già identico alla versione richiesta."; exit 0; }
          git config user.name "Superadmin Code Backup"
          git config user.email "actions@github.com"
          git add -- "$FILE"
          git commit -m "SUPERADMIN: ripristina $FILE dalla versione $SHA"
          git push origin main
        env:
          RESTORE_FILE: ${{ steps.request.outputs.file }}
          RESTORE_SHA: ${{ steps.request.outputs.sha }}

      - name: Mark restore completed
        if: always() && steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          STATUS="${{ job.status == 'success' && 'DONE' || 'ERROR' }}"
          RESULT="${{ job.status == 'success' && 'Ripristino completato automaticamente da GitHub Actions.' || 'Ripristino non completato. Controllare i log della workflow.' }}"
          curl -fsS -X POST "https://dkeqicstprvvfebiaooc.supabase.co/functions/v1/code-backup-bridge" -H "Authorization: Bearer $BRIDGE_TOKEN" -H "Content-Type: application/json" --data "$(python -c 'import json,os; print(json.dumps({"id":int(os.environ["RID"]),"status":os.environ["STATUS"],"result":os.environ["RESULT"]}))')" || true
        env:
          RID: "${{ steps.request.outputs.id }}"
          STATUS: "${{ job.status == 'success' && 'DONE' || 'ERROR' }}"
          RESULT: "${{ job.status == 'success' && 'Ripristino completato automaticamente da GitHub Actions.' || 'Ripristino non completato. Controllare i log della workflow.' }}"
          BRIDGE_TOKEN: ${{ steps.oidc.outputs.token }}
