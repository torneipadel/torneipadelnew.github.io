<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilo giocatore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-image:url('https://torneirobertobove.github.io/sfondo2.jpg');--line:rgba(255,255,255,.22);--blue:#073b72}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:#06111f var(--bg-image) center/cover fixed no-repeat;font-family:'Open Sans',Arial,sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(3,12,24,.30),rgba(3,12,24,.68));pointer-events:none;z-index:-1}
.box{width:min(620px,100%);margin:0 auto;padding:24px 22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.28);text-align:center}
.logo{width:112px;height:auto;display:block;margin:0 auto 12px}
h2{margin:0 0 12px;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.info{font-size:13px;line-height:1.45;color:rgba(255,255,255,.68);margin:0 0 12px}
input,textarea{display:block;width:100%;box-sizing:border-box;padding:0 13px;margin:7px 0;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.94);color:#333;font:600 14px 'Open Sans',Arial,sans-serif;height:46px;outline:none}
textarea{height:88px;padding:11px 13px;resize:vertical;min-height:88px}
input::placeholder,textarea::placeholder{color:#777;font-weight:400}
input:focus,textarea:focus{border-color:rgba(255,255,255,.65);box-shadow:0 0 0 2px rgba(255,255,255,.10)}
.btn,.btn-back{display:block;width:100%;min-height:46px;margin:10px 0 0;padding:11px 14px;border:1px solid rgba(255,255,255,.20);border-radius:10px;cursor:pointer;font:800 13px 'Open Sans',Arial,sans-serif;line-height:1.2}
.btn{background:#fff;color:var(--blue)}
.btn-back{background:rgba(0,0,0,.32);color:#fff}
#status{margin-top:12px;min-height:20px;color:#ffeb3b;font-size:13px;line-height:1.4}
@media(max-width:767px){body{align-items:flex-start;padding:18px 12px 28px}.box{width:min(620px,100%);padding:20px 16px;border-radius:16px}.logo{width:100px;margin-bottom:10px}h2{font-size:20px}.info{font-size:13px}input,textarea{font-size:14px}.btn,.btn-back{font-size:13px}}
@media(max-width:380px){.box{padding:18px 13px}.logo{width:92px}h2{font-size:19px}input,textarea{height:44px}.btn,.btn-back{min-height:44px}}
</style>
</head>
<body>
<div class="box">
<img src="logo.jpg" class="logo">
<h2>Profilo giocatore</h2>
<div class="info" id="emailBox">Caricamento...</div>
<input id="nome" placeholder="Nome">
<input id="cognome" placeholder="Cognome">
<input id="telefono" placeholder="Telefono">
<input id="livello" placeholder="Livello">
<input id="alias" placeholder="Alias torneo">
<textarea id="note" placeholder="Note"></textarea>
<button class="btn" onclick="salvaProfilo()">SALVA PROFILO</button>
<button class="btn-back" onclick="location.href='dashboard.html'">⬅ Torna Dashboard</button>
<div id="status"></div>
</div>
<script>
const sb = supabase.createClient(
"https://dkeqicstprvvfebiaooc.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZXFpY3N0cHJ2dmZiaWFvY29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNjQ2NjksImV4cCI6MjA3Njc0MDY2OX0.MPlE8CZ2B8pEhSJzTWBJ-FfFLQpwRAxlAlno-SCylWg",
{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
let userId=null;
let emailUtente="";
let ruoloUtente="user";
function generaAlias(nome,cognome){
if(!nome || !cognome)return "";
return nome.trim().charAt(0)+"."+cognome.trim();
}
async function caricaProfilo(){
const {data:{user}}=await sb.auth.getUser();
if(!user){window.location.href="index.html";return;}
userId=user.id;
emailUtente=user.email;
const emailBox=document.getElementById("emailBox");
if(emailBox)emailBox.innerHTML="Email: "+emailUtente;
const {data,error}=await sb.from("profili").select("*").eq("user_id",userId).single();
if(error && error.code !== "PGRST116"){
console.error("Errore caricamento profilo:",error);
const status=document.getElementById("status");
if(status)status.innerHTML="Errore caricamento profilo";
return;
}
if(!data){
console.log("Profilo non presente, creo record iniziale");
const {error:erroreCreazione}=await sb.from("profili").insert({user_id:userId,email:emailUtente,nome:"",cognome:"",telefono:"",livello:"",alias:"",note:"",ruolo:"user",updated_at:new Date().toISOString()});
if(erroreCreazione){
console.error("Errore creazione profilo:",erroreCreazione);
const status=document.getElementById("status");
if(status)status.innerHTML="Errore creazione profilo";
return;
}
ruoloUtente="user";
return;
}
ruoloUtente=data.ruolo || "user";
document.getElementById("nome").value=data.nome || "";
document.getElementById("cognome").value=data.cognome || "";
document.getElementById("telefono").value=data.telefono || "";
document.getElementById("livello").value=data.livello || "";
document.getElementById("alias").value=data.alias || "";
document.getElementById("note").value=data.note || "";
}
async function salvaProfilo(){
const nome=document.getElementById("nome").value.trim();
const cognome=document.getElementById("cognome").value.trim();
const telefono=document.getElementById("telefono").value.trim();
const livello=document.getElementById("livello").value.trim();
let alias=document.getElementById("alias").value.trim();
const note=document.getElementById("note").value.trim();
if(!nome || !cognome){document.getElementById("status").innerHTML="Inserisci nome e cognome";return;}
if(!alias){alias=generaAlias(nome,cognome);document.getElementById("alias").value=alias;}
const {error}=await sb.from("profili").upsert({user_id:userId,email:emailUtente,nome,cognome,telefono,livello,alias,note,ruolo:ruoloUtente,updated_at:new Date().toISOString()},{onConflict:"user_id"});
if(error){
console.error("Errore salvataggio profilo:",error);
document.getElementById("status").innerHTML="Errore salvataggio";
return;
}
document.getElementById("status").innerHTML="✅ Profilo salvato";
setTimeout(()=>{window.location.href="dashboard.html";},1000);
}
document.addEventListener("DOMContentLoaded",async()=>{await caricaProfilo();});
</script>
</body>
</html>
