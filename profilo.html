<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilo giocatore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-image:url('https://torneirobertobove.github.io/sfondo2.jpg');--line:rgba(255,255,255,.22);--blue:#073b72}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:#06111f var(--bg-image) center/cover fixed no-repeat;font-family:'Open Sans',Arial,sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(3,12,24,.30),rgba(3,12,24,.68));pointer-events:none;z-index:-1}
.box{width:min(620px,100%);margin:0 auto;padding:24px 22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.28);text-align:center}
.logo{width:min(300px,94%);height:78px;object-fit:contain;display:block;margin:0 auto 4px}.brand-subtitle{display:block;margin:0 auto 16px;color:#fff;font-size:14px;font-style:italic;font-weight:700;letter-spacing:1.2px;text-shadow:0 2px 6px rgba(0,0,0,.7)}
h2{margin:0 0 12px;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.info{font-size:13px;line-height:1.45;color:rgba(255,255,255,.68);margin:0 0 12px}
input,textarea{display:block;width:100%;box-sizing:border-box;padding:0 13px;margin:7px 0;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.94);color:#333;font:600 14px 'Open Sans',Arial,sans-serif;height:46px;outline:none}
textarea{height:88px;padding:11px 13px;resize:vertical;min-height:88px}
input::placeholder,textarea::placeholder{color:#777;font-weight:400}
input:focus,textarea:focus{border-color:rgba(255,255,255,.65);box-shadow:0 0 0 2px rgba(255,255,255,.10)}
.btn,.btn-back{display:block;width:100%;min-height:46px;margin:10px 0 0;padding:11px 14px;border:1px solid rgba(255,255,255,.20);border-radius:10px;cursor:pointer;font:800 13px 'Open Sans',Arial,sans-serif;line-height:1.2}
.btn{background:#fff;color:var(--blue)}
.btn-back{background:rgba(0,0,0,.32);color:#fff}
#status{margin-top:12px;min-height:20px;color:#ffeb3b;font-size:13px;line-height:1.4}
@media(max-width:767px){body{align-items:flex-start;padding:18px 12px 28px}.box{width:min(620px,100%);padding:20px 16px;border-radius:16px}.logo{width:92%;height:70px;margin-bottom:4px}.brand-subtitle{font-size:13px;margin-bottom:14px}h2{font-size:20px}.info{font-size:13px}input,textarea{font-size:14px}.btn,.btn-back{font-size:13px}}
@media(max-width:380px){.box{padding:18px 13px}.logo{width:92%;height:64px}.brand-subtitle{font-size:12px;letter-spacing:1px}h2{font-size:19px}input,textarea{height:44px}.btn,.btn-back{min-height:44px}}

/* Marchio Eventour uniforme, identico al riferimento news.html */
.news-brand-banner{position:relative;isolation:isolate;width:100%;height:125px;margin:0 0 16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:url("FOTO_PADEL1.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.30)}
.news-brand-banner:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(3,17,31,.62),rgba(3,17,31,.28),rgba(3,17,31,.58));pointer-events:none}
.news-eventour-logo{position:relative;z-index:1;display:block;width:min(560px,94%);height:78px;max-width:94%;max-height:none;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;filter:none;opacity:1}
.news-brand-subtitle{position:relative;z-index:1;color:#fff;font-family:'Open Sans',Arial,sans-serif;font-size:15px;font-style:italic;font-weight:700;letter-spacing:1.6px;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.7);text-align:center}
@media(max-width:600px){.news-brand-banner{height:112px;margin-bottom:13px;border-radius:19px}.news-eventour-logo{height:70px;width:92%;max-width:92%}.news-brand-subtitle{font-size:13px;letter-spacing:1.2px}}
@media(max-width:390px){.news-brand-banner{height:104px}.news-eventour-logo{height:64px;width:92%;max-width:92%}.news-brand-subtitle{font-size:12px;letter-spacing:1px}}
</style>
<link rel="stylesheet" href="mobile-layout-fixes.css?v=1">
</head>
<body>
<div class="box">
<section class="news-brand-banner" aria-label="EVENTOUR gestione &amp; eventi"><img src="eventour_logo.jpg" class="news-eventour-logo" alt="EVENTOUR"><span class="news-brand-subtitle">gestione eventi &amp; tornei</span></section>
<h2>Profilo giocatore</h2>
<div class="info" id="emailBox">Caricamento dati account...</div>
<input id="nome" autocomplete="given-name" placeholder="Nome">
<input id="cognome" autocomplete="family-name" placeholder="Cognome">
<input id="emailContatto" type="email" autocomplete="email" placeholder="Email di contatto">
<input id="telefono" type="tel" autocomplete="tel" placeholder="Telefono / cellulare">
<input id="indirizzo" autocomplete="street-address" placeholder="Via e numero civico">
<input id="citta" autocomplete="address-level2" placeholder="Città">
<input id="provincia" autocomplete="address-level1" placeholder="Provincia">
<input id="cap" autocomplete="postal-code" inputmode="numeric" placeholder="CAP">
<input id="paese" autocomplete="country-name" placeholder="Paese">
<input id="data_nascita" type="date" autocomplete="bday" aria-label="Data di nascita">
<input id="livello" placeholder="Livello di gioco">
<input id="alias" placeholder="Alias torneo">
<textarea id="note" placeholder="Note personali"></textarea>
<div class="info">L'email di contatto nel profilo non modifica l'indirizzo usato per accedere.</div>
<button class="btn" onclick="salvaProfilo()">SALVA PROFILO</button>
<button class="btn-back" onclick="tornaVisitatore()">⬅ Torna ai tornei</button>
<div id="status"></div>
</div>
<script>
const sb = supabase.createClient(
"https://dkeqicstprvvfebiaooc.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZXFpY3N0cHJ2dmZiaWFvY29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNjQ2NjksImV4cCI6MjA3Njc0MDY2OX0.MPlE8CZ2B8pEhSJzTWBJ-FfFLQpwRAxlAlno-SCylWg",
{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
let userId=null;
let emailUtente="";
let ruoloUtente="user";
const profiloParams=new URLSearchParams(location.search);
const aziendaSlug=profiloParams.get("azienda")||sessionStorage.getItem("nextpoint_login_azienda_slug")||localStorage.getItem("nextpoint_public_azienda_slug")||"";
function tornaVisitatore(){location.href="visitatore.html"+(aziendaSlug?"?azienda="+encodeURIComponent(aziendaSlug):"");}
function generaAlias(nome,cognome){
if(!nome || !cognome)return "";
return nome.trim().charAt(0)+"."+cognome.trim();
}
async function caricaProfilo(){
const {data:{user}}=await sb.auth.getUser();
if(!user){window.location.href="login-utente.html"+(aziendaSlug?"?azienda="+encodeURIComponent(aziendaSlug):"");return;}
userId=user.id;
emailUtente=user.email;
const emailBox=document.getElementById("emailBox");
if(emailBox)emailBox.textContent="Account: "+emailUtente;
const {data,error}=await sb.from("profili").select("*").eq("user_id",userId).single();
if(error && error.code !== "PGRST116"){
console.error("Errore caricamento profilo:",error);
const status=document.getElementById("status");
if(status)status.innerHTML="Errore caricamento profilo";
return;
}
if(!data){
console.log("Profilo non presente, creo record iniziale");
const {error:erroreCreazione}=await sb.from("profili").insert({user_id:userId,email:emailUtente,nome:"",cognome:"",telefono:"",indirizzo:"",citta:"",provincia:"",cap:"",paese:"",data_nascita:null,livello:"",alias:"",note:"",ruolo:"user",updated_at:new Date().toISOString()});
if(erroreCreazione){
console.error("Errore creazione profilo:",erroreCreazione);
const status=document.getElementById("status");
if(status)status.innerHTML="Errore creazione profilo";
return;
}
ruoloUtente="user";
return;
}
ruoloUtente=data.ruolo || "user";
document.getElementById("nome").value=data.nome || "";
document.getElementById("cognome").value=data.cognome || "";
document.getElementById("emailContatto").value=data.email || emailUtente || "";
document.getElementById("telefono").value=data.telefono || "";
document.getElementById("indirizzo").value=data.indirizzo || "";
document.getElementById("citta").value=data.citta || "";
document.getElementById("provincia").value=data.provincia || "";
document.getElementById("cap").value=data.cap || "";
document.getElementById("paese").value=data.paese || "";
document.getElementById("data_nascita").value=data.data_nascita || "";
document.getElementById("livello").value=data.livello || "";
document.getElementById("alias").value=data.alias || "";
document.getElementById("note").value=data.note || "";
}
async function salvaProfilo(){
const nome=document.getElementById("nome").value.trim();
const cognome=document.getElementById("cognome").value.trim();
const emailContatto=document.getElementById("emailContatto").value.trim();
const telefono=document.getElementById("telefono").value.trim();
const indirizzo=document.getElementById("indirizzo").value.trim();
const citta=document.getElementById("citta").value.trim();
const provincia=document.getElementById("provincia").value.trim();
const cap=document.getElementById("cap").value.trim();
const paese=document.getElementById("paese").value.trim();
const data_nascita=document.getElementById("data_nascita").value || null;
const livello=document.getElementById("livello").value.trim();
let alias=document.getElementById("alias").value.trim();
const note=document.getElementById("note").value.trim();
if(!nome || !cognome){document.getElementById("status").textContent="Inserisci nome e cognome";return;}
if(emailContatto && !document.getElementById("emailContatto").checkValidity()){document.getElementById("status").textContent="Inserisci un indirizzo email valido";return;}
if(!alias){alias=generaAlias(nome,cognome);document.getElementById("alias").value=alias;}
const {error}=await sb.from("profili").upsert({user_id:userId,email:emailContatto||emailUtente,nome,cognome,telefono,indirizzo,citta,provincia,cap,paese,data_nascita,livello,alias,note,ruolo:ruoloUtente,updated_at:new Date().toISOString()},{onConflict:"user_id"});
if(error){
console.error("Errore salvataggio profilo:",error);
document.getElementById("status").innerHTML="Errore salvataggio";
return;
}
document.getElementById("status").innerHTML="✅ Profilo salvato";
setTimeout(()=>{tornaVisitatore();},1000);
}
document.addEventListener("DOMContentLoaded",async()=>{await caricaProfilo();});
</script>
<script src="site-navigation-v1.js?v=8"></script>
<script>
(function isolateNewsEventourLogo(){const logo=document.querySelector(".news-eventour-logo");if(!logo)return;function isolate(){if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;logo.dataset.textIsolated="1";try{const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png")}catch(e){console.warn("Trattamento logo Eventour non riuscito:",e)}}if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true})})();
</script>
</body>
</html>
