<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVENTOUR · Control Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="eventour-control-center-v1.css?v=20261015-3">
<link rel="stylesheet" href="mobile-layout-fixes.css?v=1">
<style>/* Marchio Eventour uniforme: riferimento news.html */.news-brand-banner{position:relative;isolation:isolate;width:min(760px,calc(100% - 28px));height:125px;margin:18px auto 16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:url("FOTO_PADEL1.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.30);box-sizing:border-box}.news-brand-banner:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(3,17,31,.62),rgba(3,17,31,.28),rgba(3,17,31,.58));pointer-events:none}.news-eventour-logo{position:relative;z-index:1;display:block;width:min(560px,94%);height:78px;max-width:94%;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;filter:none;opacity:1}.news-brand-subtitle{position:relative;z-index:1;color:#fff;font-family:'Open Sans',Arial,sans-serif;font-size:15px;font-style:italic;font-weight:700;letter-spacing:1.6px;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.7);text-align:center}@media(max-width:600px){.news-brand-banner{height:112px;margin:10px auto 13px;border-radius:19px}.news-eventour-logo{height:70px;width:92%;max-width:92%}.news-brand-subtitle{font-size:13px;letter-spacing:1.2px}}@media(max-width:390px){.news-brand-banner{height:104px}.news-eventour-logo{height:64px;width:92%;max-width:92%}.news-brand-subtitle{font-size:12px;letter-spacing:1px}}</style></head>
<body><section class="news-brand-banner" aria-label="EVENTOUR gestione &amp; eventi"><img src="eventour_logo.jpg" class="news-eventour-logo" alt="EVENTOUR"><span class="news-brand-subtitle">gestione &amp; eventi</span></section>
<div class="cc-shell">
<header class="cc-header">
  <div><div class="eyebrow">EVENTOUR · SUPERADMIN GLOBALE</div><h1>Control Center</h1><p>Gestione società, piani, accessi e registro attività della piattaforma.</p></div>
  <div class="cc-actions"><button id="refreshBtn">↻ Aggiorna</button><button id="backBtn">← Pagina principale</button></div>
</header>
<main id="app"><div class="loading">Caricamento Control Center…</div></main>
</div>
<script src="eventour-control-center-v1.js?v=20261017-1"></script>
<script src="site-navigation-v1.js?v=1"></script>
<script>(function isolateNewsEventourLogo(){const logo=document.querySelector(".news-eventour-logo");if(!logo)return;function isolate(){if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;logo.dataset.textIsolated="1";try{const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png")}catch(e){console.warn("Trattamento logo Eventour non riuscito:",e)}}if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true})})();</script></body>
</html>
