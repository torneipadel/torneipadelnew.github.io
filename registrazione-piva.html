<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partita IVA — Next Point Padel</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#071219,#073b72)}
main{width:min(560px,100%);padding:34px;border:1px solid #ffffff30;border-radius:24px;background:#ffffff12;box-shadow:0 20px 60px #0005}h1{margin:0 0 8px;text-align:center;font-size:25px}p{color:#d8e0e8;line-height:1.5;text-align:center}.step{text-align:center;font-size:12px;font-weight:700;color:#ffe76b;margin-bottom:25px}label{display:block;margin:0 0 8px;font-weight:700;font-size:13px}input{width:100%;height:50px;border:1px solid #ffffff45;border-radius:11px;background:#ffffff12;color:#fff;padding:0 14px;font-size:16px;outline:none}input:focus{border-color:#fff;background:#ffffff1c}button{width:100%;height:50px;margin-top:18px;border:0;border-radius:11px;background:#fff;color:#073b72;font-weight:800;cursor:pointer}.back{background:#ffffff12;color:#fff;border:1px solid #ffffff35}.status{min-height:22px;margin-top:14px;text-align:center;color:#ffe76b;font-size:13px}
</style></head><body><main>
<div class="step">1 · IDENTIFICAZIONE SOCIETÀ</div>
<h1>Inserisci la Partita IVA</h1>
<p>Inserisci la Partita IVA della società che vuoi registrare su Next Point Padel. Questo dato verrà associato alla tua società.</p>
<form id="f">
<label for="piva">Partita IVA *</label>
<input id="piva" required inputmode="numeric" autocomplete="off" maxlength="16" placeholder="Es. 12345678901">
<button type="submit">CONTINUA</button>
<button type="button" class="back" onclick="location.href='index.html'">INDIETRO</button>
<div class="status" id="s"></div>
</form></main>
<script>
const f=document.getElementById("f"),piva=document.getElementById("piva"),s=document.getElementById("s");
const KEY="nextpoint_registration_piva";
piva.value=(sessionStorage.getItem(KEY)||"").trim();
f.addEventListener("submit",e=>{
 e.preventDefault();
 const value=piva.value.trim();
 if(!value){s.textContent="Inserisci la Partita IVA.";return}
 sessionStorage.setItem(KEY,value);
 location.href="registrazione-societa.html";
});
</script></body></html>
