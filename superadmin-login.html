<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EVENTOUR — Accesso Superadmin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071d35;font-family:Arial,sans-serif;color:#12253a}
.card{width:min(410px,calc(100% - 32px));padding:32px;border-radius:20px;background:#fff;box-shadow:0 25px 70px rgba(0,0,0,.3)}
h1{margin:0 0 8px;color:#071d35}p{color:#607286;line-height:1.5;font-size:14px}
label{display:block;margin:16px 0 6px;font-weight:700;font-size:13px}
input{width:100%;height:48px;padding:0 12px;box-sizing:border-box;border:1px solid #dfe7ee;border-radius:9px}
button{width:100%;height:48px;margin-top:18px;border:0;border-radius:9px;background:#0a4778;color:#fff;font-weight:800;cursor:pointer}
#error{min-height:20px;margin-top:12px;color:#b42318;font-size:13px;font-weight:700}
.back{display:block;margin-top:16px;text-align:center;color:#607286;font-size:13px}
</style>
</head>
<body>
<main class="card">
<h1>🔐 Accesso Superadmin</h1>
<p>Accesso riservato al responsabile della piattaforma EVENTOUR. Questo accesso non utilizza Partita IVA, Codice Fiscale o una società.</p>
<form id="form">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<div id="error" role="alert"></div>
<button id="submit" type="submit">Accedi al Control Center</button>
<div style="text-align:center;margin-top:12px"><button id="forgot" type="button" style="width:auto;height:auto;margin:0;padding:0;background:none;color:#0a4778;font-weight:700">Password dimenticata?</button></div>
</form>
<div id="recoveryBox" style="display:none;margin-top:18px;padding-top:18px;border-top:1px solid #e5eaf0">
<p style="margin:0 0 8px"><b>Imposta nuova password</b></p>
<label for="newPassword">Nuova password</label>
<input id="newPassword" type="password" autocomplete="new-password" minlength="8">
<label for="confirmPassword">Conferma password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8">
<button id="savePassword" type="button">Salva nuova password</button>
</div>
<div id="resetBox" style="display:none;margin-top:18px;padding-top:18px;border-top:1px solid #e5eaf0">
<p style="margin:0 0 8px">Inserisci l'email del Superadmin. Riceverai il link per impostare una nuova password.</p>
<button id="reset" type="button">Invia link di reset</button>
</div>
<a class="back" href="index.html">← Torna alla pagina centrale</a>
</main>
<script>
const SUPABASE_URL="https://dkeqicstprvvfebiaooc.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const form=document.getElementById("form"),error=document.getElementById("error"),submit=document.getElementById("submit");
const forgot=document.getElementById("forgot"),resetBox=document.getElementById("resetBox"),reset=document.getElementById("reset");
const recoveryBox=document.getElementById("recoveryBox"),savePassword=document.getElementById("savePassword");
forgot.addEventListener("click",()=>{resetBox.style.display="block";document.getElementById("email").focus();error.textContent=""});
function showRecovery(){
 recoveryBox.style.display="block";
 resetBox.style.display="none";
 form.style.display="none";
 forgot.style.display="none";
 document.querySelector(".back").style.display="none";
 error.style.color="#607286";
 error.textContent="Inserisci la nuova password.";
}
async function handleRecovery(){
 const hash=window.location.hash||"";
 const hasRecovery=/type=recovery/i.test(hash)||new URLSearchParams(window.location.search).get("type")==="recovery";
 if(hasRecovery){
   showRecovery();
   return;
 }
}
savePassword.addEventListener("click",async()=>{
 error.style.color="#b42318";error.textContent="";
 const p=document.getElementById("newPassword").value;
 const cp=document.getElementById("confirmPassword").value;
 if(p.length<8){error.textContent="La nuova password deve contenere almeno 8 caratteri.";return}
 if(p!==cp){error.textContent="Le password non coincidono.";return}
 savePassword.disabled=true;savePassword.textContent="Salvataggio...";
 const {error:err}=await sb.auth.updateUser({password:p});
 if(err){error.textContent=err.message;savePassword.disabled=false;savePassword.textContent="Salva nuova password";return}
 await sb.auth.signOut();
 recoveryBox.style.display="none";form.style.display="";
 document.querySelector(".back").style.display="";
 error.style.color="#147a42";error.textContent="Password aggiornata correttamente. Ora puoi accedere.";
 savePassword.disabled=false;savePassword.textContent="Salva nuova password";
 history.replaceState({},document.title,window.location.pathname);
});
sb.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY") showRecovery();});
handleRecovery();
reset.addEventListener("click",async()=>{
error.textContent="";reset.disabled=true;reset.textContent="Invio...";
try{
const address=document.getElementById("email").value.trim();
if(!address) throw new Error("Inserisci prima l'email del Superadmin.");
const result=await sb.auth.resetPasswordForEmail(address,{redirectTo:window.location.origin+window.location.pathname});
if(result.error) throw result.error;
error.style.color="#147a42";error.textContent="Link di reset inviato. Controlla la casella email.";
}catch(err){error.style.color="#b42318";error.textContent=err&&err.message?err.message:"Impossibile inviare il link di reset."}
reset.disabled=false;reset.textContent="Invia link di reset";
});
form.addEventListener("submit",async function(e){
e.preventDefault();error.textContent="";submit.disabled=true;submit.textContent="Verifica accesso...";
try{
const result=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
if(result.error)throw result.error;
const check=await sb.rpc("is_superadmin");
if(check.error||check.data!==true){await sb.auth.signOut();throw new Error("Account autenticato ma non autorizzato come Superadmin.");}
window.location.href="eventour-control-center.html";
}catch(err){error.textContent=err&&err.message?err.message:"Accesso non riuscito.";submit.disabled=false;submit.textContent="Accedi al Control Center";}
});
</script>
</body>
</html>
