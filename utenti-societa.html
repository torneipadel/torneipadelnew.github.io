<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utenti società · Next Point Padel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(rgba(3,12,24,.42),rgba(3,12,24,.82)),url('sfondo2.jpg') center/cover fixed no-repeat;padding:18px}.page{width:min(1000px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.top a{color:#fff;text-decoration:none;font-weight:700}.card{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);border-radius:22px;padding:24px;box-shadow:0 16px 45px rgba(0,0,0,.25)}h1{margin:0 0 6px}p{color:#d0d6df}.form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin:18px 0}.form input,.form select{width:100%;padding:11px;border-radius:9px;border:1px solid #ffffff35;background:#ffffff10;color:#fff}.form select option{color:#111}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#fff;color:#073b72}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px;border-bottom:1px solid #ffffff18;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#bfc8d4}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#ffffff15}.active{color:#9ff0b0}.off{color:#ffb2b2}.actions button{margin-right:6px;margin-bottom:5px;padding:7px 9px;border-radius:7px;border:1px solid #ffffff25;background:#ffffff12;color:#fff;cursor:pointer}.danger{border-color:#ff8d8d!important}.note{font-size:12px}.status{margin:12px 0;min-height:18px;color:#ffe76b}@media(max-width:750px){.form{grid-template-columns:1fr}.card{padding:18px}}</style><script src="tenant-theme-v1.js?v=1"></script>
</head><body><main class="page"><div class="top"><a href="admin.html">← Gestione Tornei</a><a href="dashboard.html">Home</a></div><section class="card"><h1>👥 Utenti della società</h1><p>Il proprietario può invitare amministratori e utenti. Gli utenti appartengono esclusivamente a questa società.</p><div class="form"><input id="nome" placeholder="Nome"><input id="cognome" placeholder="Cognome"><input id="email" type="email" placeholder="Email"><select id="ruolo"><option value="user">Utente</option><option value="admin">Admin</option></select><button class="btn" id="create">+ INVITA UTENTE</button></div><div id="status" class="status"></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Stato</th><th>Azioni</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const SB_URL="https://dkeqicstprvvfebiaooc.supabase.co";const SB_KEY="sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu";const sb=supabase.createClient(SB_URL,SB_KEY);const statusEl=document.getElementById("status");
async function call(body){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="index.html";return null}const r=await fetch(SB_URL+"/functions/v1/tenant-user-management",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||"Operazione non riuscita");return j}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
async function load(){try{const j=await call({action:"list"});if(!j)return;document.getElementById("create").disabled=j.caller_role!=="owner";if(j.caller_role!=="owner")statusEl.textContent="Sei Admin: puoi consultare gli utenti. La gestione di ruoli e inviti è riservata al proprietario.";rows.innerHTML=(j.users||[]).map(u=>`<tr><td>${esc((u.nome+" "+u.cognome).trim()||"—")}</td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.ruolo)}</span></td><td class="${u.attivo?"active":"off"}">${u.attivo?"Attivo":"Disattivato"}</td><td class="actions">${j.caller_role==="owner"&&u.ruolo!=="owner"?`<button onclick="changeRole('${u.user_id}','${u.ruolo==="admin"?"user":"admin"}')">→ ${u.ruolo==="admin"?"Utente":"Admin"}</button><button class="danger" onclick="toggleUser('${u.user_id}',${!u.attivo})">${u.attivo?"Disattiva":"Riattiva"}</button>`:"—"}</td></tr>`).join("")}catch(e){statusEl.textContent="Errore: "+e.message}}
async function changeRole(id,role){try{await call({action:"role",user_id:id,ruolo:role});statusEl.textContent="Ruolo aggiornato.";load()}catch(e){statusEl.textContent="Errore: "+e.message}}
async function toggleUser(id,attivo){try{await call({action:"active",user_id:id,attivo});statusEl.textContent=attivo?"Utente riattivato.":"Utente disattivato.";load()}catch(e){statusEl.textContent="Errore: "+e.message}}
create.onclick=async()=>{try{statusEl.textContent="Invio invito…";await call({action:"create",nome:nome.value,cognome:cognome.value,email:email.value,ruolo:ruolo.value});nome.value="";cognome.value="";email.value="";statusEl.textContent="✅ Invito inviato. L'utente dovrà completare l'accesso dall'email ricevuta.";load()}catch(e){statusEl.textContent="Errore: "+e.message}};
load();
</script></body></html>
