<style>
:root{--line:rgba(255,255,255,.22);--blue:#073b72;--gold:#ffe76b;--green:#54d68b;--red:#ff9b9b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:'Open Sans',Arial,sans-serif;color:#fff;background:#06111f url('sfondo2.jpg') center/cover fixed no-repeat;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(3,12,24,.30),rgba(3,12,24,.68));pointer-events:none;z-index:-1}.page{width:min(760px,calc(100% - 28px));margin:auto;padding:18px 0 45px}.news-brand-banner{position:relative;isolation:isolate;width:100%;height:125px;margin:0 0 16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:url("FOTO_PADEL1.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.30)}.news-brand-banner:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(115deg,rgba(3,17,31,.62),rgba(3,17,31,.28),rgba(3,17,31,.58));pointer-events:none}.news-eventour-logo{position:relative;z-index:1;display:block;width:310px;height:88px;max-width:100%;margin:0 auto;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;filter:none;opacity:1}.news-brand-subtitle{position:relative;z-index:1;display:block;width:100%;margin:-7px 0 0;color:#fff;font-family:Jost,Inter,'Open Sans',Arial,sans-serif;font-size:11px;font-style:italic;font-weight:600;letter-spacing:1.35px;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.35);text-align:center;white-space:nowrap}.heroTitle{margin:30px 3px 18px;padding:0;border:0;background:none;box-shadow:none}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.heroTitle h1{font-size:clamp(32px,7vw,48px);line-height:1;letter-spacing:-.04em;margin:8px 0 10px}.heroTitle p{margin:0;color:rgba(255,255,255,.66);font-size:13px;line-height:1.6}.featured{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.18);border-radius:20px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:14px}.featuredMedia{width:100%;min-height:220px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14)}.featuredMedia img{width:100%;height:auto;max-height:650px;object-fit:contain;display:block}.featuredNoImage{min-height:220px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.52);font-weight:700;font-size:12px}.featuredBody{padding:24px}.badge{display:inline-flex;width:max-content;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:var(--gold);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px}.featuredBody h2{font-size:28px;line-height:1.12;letter-spacing:-.02em;margin:10px 0 7px}.date{color:rgba(255,255,255,.52);font-size:10px;margin-bottom:14px}.text{white-space:pre-line;color:rgba(255,255,255,.68);line-height:1.65;max-width:900px;font-size:12px}.cta{display:inline-flex;align-items:center;width:max-content;margin-top:14px;background:#fff;color:var(--blue);text-decoration:none;padding:10px 13px;border-radius:10px;font:800 9px 'Open Sans',Arial,sans-serif;box-shadow:none}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}.filter{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 11px;font:700 10px 'Open Sans',Arial,sans-serif;cursor:pointer}.filter.active,.filter:hover{background:#fff;color:var(--blue)}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.18);border-radius:20px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column}.cardMedia{aspect-ratio:16/10;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14)}.cardMedia img{width:100%;height:100%;object-fit:cover;display:block}.cardBody{padding:17px 17px 19px;display:flex;flex-direction:column;flex:1}.cardBody h3{margin:7px 0 7px;font-size:17px;line-height:1.2;letter-spacing:0}.cardBody p{margin:0;color:rgba(255,255,255,.62);line-height:1.45;font-size:11px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.cardBody .cta{margin-top:auto;align-self:flex-start}.smallDate{font-size:9px;color:rgba(255,255,255,.52);font-weight:700;letter-spacing:.01em}.adminDelete{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:max-content;margin-top:12px;padding:8px 11px;border:1px solid rgba(255,155,155,.18);border-radius:9px;background:rgba(255,155,155,.08);color:var(--red);font:700 9px 'Open Sans',Arial,sans-serif;cursor:pointer}.featuredBody .adminDelete{margin-top:12px}.empty{padding:30px 18px;border:1px dashed rgba(255,255,255,.22);border-radius:20px;background:rgba(255,255,255,.06);text-align:center;color:rgba(255,255,255,.62);font-size:12px}.loading{text-align:center;padding:54px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25);font-weight:700;font-size:12px}.np-menu,.np-menu a,.np-menu strong{font-family:'Open Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
@media(max-width:600px){body{background-attachment:scroll}.page{width:calc(100% - 20px);padding-top:10px}.news-brand-banner{height:125px;margin-bottom:13px;border-radius:19px}.news-eventour-logo{height:88px;width:310px;max-width:100%}.news-brand-subtitle{font-size:11px;letter-spacing:1.35px}.heroTitle{margin-top:25px}.heroTitle h1{font-size:40px}.featured{border-radius:19px}.featuredMedia{min-height:190px}.featuredBody{padding:20px}.featuredBody h2{font-size:26px}.card{border-radius:19px}.filters{gap:7px}.filter{padding:8px 11px}}
@media(max-width:390px){.news-brand-banner{height:125px}.news-eventour-logo{height:88px;width:310px;max-width:100%}.news-brand-subtitle{font-size:11px;letter-spacing:1.35px}}@media(prefers-reduced-motion:reduce){.cta,.filter{transition:none}}


.brand-back{width:40px;height:40px;margin:0 0 12px;border:1px solid rgba(255,255,255,.18);border-radius:11px;background:rgba(255,255,255,.09);color:#fff;font:400 20px 'Open Sans',Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.brand-back:hover{background:rgba(255,255,255,.15)}
</style>

<body>
<div class="page">

<button type="button" class="brand-back" onclick="history.back()" aria-label="Torna indietro">←</button>
<section class="news-brand-banner" aria-label="EVENTOUR gestione & eventi">
<img src="loghi/eventour_trasp.png?v=20261025" class="news-eventour-logo" alt="EVENTOUR">
<span class="news-brand-subtitle">gestione eventi &amp; tornei</span>
</section>
<section class="heroTitle"><div class="eyebrow">Comunicazioni & contenuti</div><h1>News</h1><p>Tornei, promozioni, eventi, ricordi e novità del club.</p></section>
<main id="app"><div class="loading">Caricamento delle News…</div></main>
</div>
<script>
const SUPABASE_URL='https://dkeqicstprvvfebiaooc.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZXFpY3N0cHJ2dmZiaWFvY29pIiwiaWF0IjoxNzYxMTY0NjY5LCJleHAiOjIwNzY3NDA2Njl9.MPlE8CZ2B8pEhSJzTWBJ-FfFLQpwRAxlAlno-SCylWg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const formatDate=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})};
const imageTag=(src,alt,cls)=>src?'<img class="'+cls+'" src="'+esc(src)+'" alt="'+esc(alt)+'" loading="lazy">':'';
function cardHtml(n){const im=n.locandina||n.immagine||'';return '<article class="card">'+(im?'<div class="cardMedia">'+imageTag(im,n.titolo||'News','')+'</div>':'')+'<div class="cardBody"><span class="smallDate">'+esc(n.tipo||'Comunicazione')+' · '+esc(formatDate(n.created_at))+'</span><h3>'+esc(n.titolo||'Senza titolo')+'</h3><p>'+esc(n.testo||'')+'</p>'+(n.link?'<a class="cta" href="'+esc(n.link)+'" target="_blank" rel="noopener noreferrer">Apri →</a>':'')+'</div></article>'}
function renderNews(list){
 if(!list.length){app.innerHTML='<div class="empty">Questa società non ha ancora pubblicato News.</div>';return}
 const featured=list.find(n=>n.in_evidenza)||list[0],cards=list.filter(n=>n.id!==featured.id);
 const im=featured.locandina||featured.immagine||'';
 const cats=['Tutte',...new Set(list.map(n=>n.tipo||'Comunicazione'))];
 app.innerHTML='<section class="featured"><div class="featuredMedia">'+(im?imageTag(im,featured.titolo||'News',''):'<div class="featuredNoImage">News in evidenza</div>')+'</div><div class="featuredBody"><span class="badge">'+esc(featured.tipo||'Comunicazione')+'</span><h2>'+esc(featured.titolo||'Senza titolo')+'</h2><div class="date">'+esc(formatDate(featured.created_at))+'</div><div class="text">'+esc(featured.testo||'')+'</div>'+(featured.link?'<a class="cta" href="'+esc(featured.link)+'" target="_blank" rel="noopener noreferrer">Scopri di più →</a>':'')+'</div></section><div class="filters">'+cats.map((x,i)=>'<button class="filter '+(i===0?'active':'')+'" data-cat="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div><section class="grid" id="newsGrid">'+cards.map(cardHtml).join('')+'</section>';
 document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const cat=btn.dataset.cat;document.getElementById('newsGrid').innerHTML=list.filter(n=>n.id!==featured.id&&(cat==='Tutte'||(n.tipo||'Comunicazione')===cat)).map(cardHtml).join('')}));
}
async function loadNews(){
 const slug=(new URLSearchParams(location.search).get('azienda')||'').trim();
 if(!slug){app.innerHTML='<div class="empty">Società non specificata. Apri le News dalla pagina della società.</div>';return}
 const companyRes=await sb.rpc('get_public_company',{p_slug:slug});
 const company=Array.isArray(companyRes.data)?companyRes.data[0]:companyRes.data;
 if(companyRes.error||!company?.id){console.error('Verifica società News:',companyRes.error);app.innerHTML='<div class="empty">Società non trovata o non disponibile.</div>';return}
 const newsRes=await sb.rpc('get_public_company_news_v2',{p_slug:slug});
 if(newsRes.error){console.error('Caricamento News:',newsRes.error);app.innerHTML='<div class="empty">Le News di questa società non sono momentaneamente disponibili.</div>';return}
 const list=(newsRes.data||[]).filter(n=>n.pubblicata===true).sort((a,b)=>Number(!!b.in_evidenza)-Number(!!a.in_evidenza)||(Number(a.ordine)||0)-(Number(b.ordine)||0)||String(b.created_at||'').localeCompare(String(a.created_at||'')));
 renderNews(list);
}
loadNews().catch(error=>{console.error('Errore pagina News:',error);app.innerHTML='<div class="empty">Errore durante il caricamento delle News. Riprova più tardi.</div>'});</script>
