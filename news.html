<style>
:root{--line:rgba(255,255,255,.22);--blue:#073b72;--gold:#ffe76b;--green:#54d68b;--red:#ff9b9b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:'Open Sans',Arial,sans-serif;color:#fff;background:#06111f url('sfondo2.jpg') center/cover fixed no-repeat;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(3,12,24,.30),rgba(3,12,24,.68));pointer-events:none;z-index:-1}.page{width:min(760px,calc(100% - 28px));margin:auto;padding:18px 0 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(4,15,29,.50);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.22);position:sticky;top:12px;z-index:20}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-logo{width:112px;height:auto;display:block}.brand-copy{display:flex;flex-direction:column;justify-content:center;min-width:0}.brand-name{font-size:16px;font-weight:800;letter-spacing:.8px;line-height:1.15}.brand-sub{font-size:9px;font-weight:500;color:rgba(255,255,255,.64);line-height:1.35;margin-top:3px;white-space:nowrap}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--blue);background:#fff;border:1px solid rgba(255,255,255,.20);padding:10px 14px;border-radius:10px;font:800 9px 'Open Sans',Arial,sans-serif;white-space:nowrap;box-shadow:none}.heroTitle{margin:30px 3px 18px;padding:0;border:0;background:none;box-shadow:none}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.heroTitle h1{font-size:clamp(32px,7vw,48px);line-height:1;letter-spacing:-.04em;margin:8px 0 10px}.heroTitle p{margin:0;color:rgba(255,255,255,.66);font-size:13px;line-height:1.6}.featured{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.18);border-radius:20px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:14px}.featuredMedia{width:100%;min-height:220px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14)}.featuredMedia img{width:100%;height:auto;max-height:650px;object-fit:contain;display:block}.featuredNoImage{min-height:220px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.52);font-weight:700;font-size:12px}.featuredBody{padding:24px}.badge{display:inline-flex;width:max-content;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:var(--gold);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px}.featuredBody h2{font-size:28px;line-height:1.12;letter-spacing:-.02em;margin:10px 0 7px}.date{color:rgba(255,255,255,.52);font-size:10px;margin-bottom:14px}.text{white-space:pre-line;color:rgba(255,255,255,.68);line-height:1.65;max-width:900px;font-size:12px}.cta{display:inline-flex;align-items:center;width:max-content;margin-top:14px;background:#fff;color:var(--blue);text-decoration:none;padding:10px 13px;border-radius:10px;font:800 9px 'Open Sans',Arial,sans-serif;box-shadow:none}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}.filter{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 11px;font:700 10px 'Open Sans',Arial,sans-serif;cursor:pointer}.filter.active,.filter:hover{background:#fff;color:var(--blue)}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.18);border-radius:20px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column}.cardMedia{aspect-ratio:16/10;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14)}.cardMedia img{width:100%;height:100%;object-fit:cover;display:block}.cardBody{padding:17px 17px 19px;display:flex;flex-direction:column;flex:1}.cardBody h3{margin:7px 0 7px;font-size:17px;line-height:1.2;letter-spacing:0}.cardBody p{margin:0;color:rgba(255,255,255,.62);line-height:1.45;font-size:11px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.cardBody .cta{margin-top:auto;align-self:flex-start}.smallDate{font-size:9px;color:rgba(255,255,255,.52);font-weight:700;letter-spacing:.01em}.adminDelete{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:max-content;margin-top:12px;padding:8px 11px;border:1px solid rgba(255,155,155,.18);border-radius:9px;background:rgba(255,155,155,.08);color:var(--red);font:700 9px 'Open Sans',Arial,sans-serif;cursor:pointer}.featuredBody .adminDelete{margin-top:12px}.empty{padding:30px 18px;border:1px dashed rgba(255,255,255,.22);border-radius:20px;background:rgba(255,255,255,.06);text-align:center;color:rgba(255,255,255,.62);font-size:12px}.loading{text-align:center;padding:54px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25);font-weight:700;font-size:12px}.np-menu,.np-menu a,.np-menu strong{font-family:'Open Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
@media(max-width:600px){body{background-attachment:scroll}.page{width:calc(100% - 20px);padding-top:10px}.top{top:7px}.brand-logo{width:94px}.brand-name{font-size:14px}.brand-sub{font-size:8px;white-space:normal}.back{padding:9px 13px;font-size:9px}.heroTitle{margin-top:25px}.heroTitle h1{font-size:40px}.featured{border-radius:19px}.featuredMedia{min-height:190px}.featuredBody{padding:20px}.featuredBody h2{font-size:26px}.card{border-radius:19px}.filters{gap:7px}.filter{padding:8px 11px}}
@media(prefers-reduced-motion:reduce){.back,.cta,.filter{transition:none}}
</style>
</head>
<body>
<div class="page">
<div class="top"><div class="brand"><img class="brand-logo" src="/loghi/icona_app1.jpg" alt="NEXT POINT PADEL"><div class="brand-copy"><div class="brand-name">NEXT POINT PADEL</div><div class="brand-sub">gestione tornei ed eventi padel</div></div></div><a class="back" href="dashboard.html?v=20260924" onclick="window.location.replace('dashboard.html?v=20260924');return false;">← Torna al sito</a></div>
<section class="heroTitle"><div class="eyebrow">Comunicazioni & contenuti</div><h1>News</h1><p>Tornei, promozioni, eventi, ricordi e novità del club.</p></section>
<main id="app"><div class="loading">Caricamento delle News…</div></main>
</div>
<script>
const SUPABASE_URL='https://dkeqicstprvvfebiaooc.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZXFpY3N0cHJ2dmZiaWFvY29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNjQ2NjksImV4cCI6MjA3Njc0MDY2OX0.MPlE8CZ2B8pEhSJzTWBJ-FfFLQpwRAxlAlno-SCylWg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let allNews=[];let isAdmin=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeNews(row){const cfg=row?.configurazione||{};const arr=Array.isArray(cfg.news)?cfg.news:[];return arr.map((n,i)=>({...n,__torneo:row.nome||'',__torneoId:row.id,__index:i,__global:false,__ordine:Number(n.ordine)||999999,__data:n.data||row.updated_at||row.data_torneo||row.data||''}))}
function normalizeGlobalNews(row){return {...row,tipo:row.tipo||'Comunicazione',titolo:row.titolo||'Senza titolo',testo:row.testo||'',immagine:row.immagine||'',inEvidenza:false,link:'',__torneo:'',__torneoId:null,__index:-1,__global:true,__ordine:999999,__data:row.created_at||''}}
function normalizeTournamentNews(row){const cfg=row?.configurazione||{};const poster=Array.isArray(cfg.news)?cfg.news.find(n=>n?.immagine)?.immagine||'':'';const d=row?.data_torneo||row?.data||'';return {tipo:'Torneo',titolo:row?.nome||'Torneo',testo:row?.descrizione||'Scopri il torneo, i dettagli e le iscrizioni.',immagine:poster,inEvidenza:false,link:'tabellone.html?idTorneo='+encodeURIComponent(row.id),__torneo:row?.nome||'',__torneoId:row?.id,__index:-1,__global:true,__ordine:500000,__data:d||row?.updated_at||''}}
function normalizeMarketNews(row){return {tipo:'Offerta',titolo:row?.titolo||'Articolo del Mercatino',testo:row?.anteprima||row?.descrizione||'Articolo disponibile nel Mercatino.',immagine:row?.immagine||'',inEvidenza:false,link:'mercatino.html',__torneo:'Mercatino',__torneoId:null,__index:-1,__global:true,__ordine:750000,__data:row?.created_at||''}}
function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})}
function sortNews(a,b){if(Boolean(b.inEvidenza)!==Boolean(a.inEvidenza))return b.inEvidenza?1:-1;if(a.__ordine!==b.__ordine)return a.__ordine-b.__ordine;return String(b.__data).localeCompare(String(a.__data))}
function imageTag(src,alt,cls){return src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:''}
function deleteButton(n){return isAdmin&&!n.__global?`<button class="adminDelete" type="button" onclick="deleteNews('${esc(String(n.__torneoId))}',${Number(n.__index)})">🗑 Elimina</button>`:''}
function render(list=allNews){const app=document.getElementById('app');if(!list.length){app.innerHTML='<div class="empty">Non ci sono News pubblicate al momento.</div>';return}const featured=list.find(n=>n.inEvidenza)||list[0];const cats=['Tutte',...new Set(list.map(n=>n.tipo||'Comunicazione'))];const cards=list.filter(n=>n!==featured);app.innerHTML=`<section class="featured"><div class="featuredMedia">${featured.immagine?imageTag(featured.immagine,featured.titolo||'Locandina',''): '<div class="featuredNoImage">News in evidenza</div>'}</div><div class="featuredBody"><span class="badge">${esc(featured.tipo||'Comunicazione')}</span><h2>${esc(featured.titolo||'Senza titolo')}</h2><div class="date">${esc(formatDate(featured.__data))}${featured.__torneo?' · '+esc(featured.__torneo):''}</div><div class="text">${esc(featured.testo||'')}</div>${featured.link?`<a class="cta" href="${esc(featured.link)}" target="_blank" rel="noopener">Scopri di più →</a>`:''}${deleteButton(featured)}</div></section><div class="filters">${cats.map((c,i)=>`<button class="filter ${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><section class="grid" id="newsGrid">${cards.map(cardHtml).join('')}</section>`;document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const cat=btn.dataset.cat;document.getElementById('newsGrid').innerHTML=list.filter(n=>n!==featured&&(cat==='Tutte'||(n.tipo||'Comunicazione')===cat)).map(cardHtml).join('')}))}
function cardHtml(n){return `<article class="card">${n.immagine?`<div class="cardMedia">${imageTag(n.immagine,n.titolo||'News','')}</div>`:''}<div class="cardBody"><span class="smallDate">${esc(n.tipo||'Comunicazione')} · ${esc(formatDate(n.__data))}</span><h3>${esc(n.titolo||'Senza titolo')}</h3><p>${esc(n.testo||'')}</p>${n.link?`<a class="cta" href="${esc(n.link)}" target="_blank" rel="noopener">Apri →</a>`:''}${deleteButton(n)}</div></article>`}
async function checkAdmin(){try{const {data:{session}}=await sb.auth.getSession();if(!session?.user?.email)return false;const {data,error}=await sb.from('profili').select('ruolo').eq('email',session.user.email).maybeSingle();if(error){console.warn('Verifica ruolo admin:',error);return false}return String(data?.ruolo||'').toLowerCase()==='admin'}catch(e){console.warn('Verifica admin non disponibile:',e);return false}}
async function deleteNews(torneoId,index){if(!isAdmin)return;if(!Number.isInteger(index)||index<0)return;const news=allNews.find(n=>String(n.__torneoId)===String(torneoId)&&Number(n.__index)===index);const titolo=news?.titolo||'questa News';if(!confirm(`Eliminare definitivamente "${titolo}"?`))return;const {data,error}=await sb.from('tornei').select('configurazione').eq('id',torneoId).maybeSingle();if(error||!data){alert('Impossibile recuperare la News da eliminare.');console.error(error);return}const cfg=data.configurazione&&typeof data.configurazione==='object'?{...data.configurazione}:{};const arr=Array.isArray(cfg.news)?cfg.news:[];if(index>=arr.length){alert('La News non è più disponibile.');await load();return}cfg.news=arr.filter((_,i)=>i!==index);const {error:updateError}=await sb.from('tornei').update({configurazione:cfg}).eq('id',torneoId);if(updateError){alert('Eliminazione non riuscita.');console.error(updateError);return}await load()}
async function load(){const [torneiRes,globalRes,marketRes]=await Promise.all([sb.from('tornei').select('id,nome,data,data_torneo,updated_at,descrizione,pubblicato,stato,configurazione').order('updated_at',{ascending:false}),sb.from('news').select('id,titolo,testo,immagine,pubblicata,created_at').eq('pubblicata',true).order('created_at',{ascending:false}),sb.from('mercatino').select('id,titolo,anteprima,descrizione,immagine,pubblicato,stato,created_at').eq('pubblicato',true).eq('stato','disponibile').order('created_at',{ascending:false})]);const torneiError=torneiRes.error,globalError=globalRes.error,marketError=marketRes.error;if(torneiError&&globalError&&marketError){document.getElementById('app').innerHTML='<div class="empty">Le News non sono momentaneamente disponibili.</div>';console.error(torneiError,globalError,marketError);return}const manualNews=globalError?[]:(globalRes.data||[]).map(normalizeGlobalNews);const torneoNews=torneiError?[]:(torneiRes.data||[]).filter(t=>t.pubblicato===true||String(t.stato||'').toLowerCase()==='attivo').map(normalizeTournamentNews);const marketNews=marketError?[]:(marketRes.data||[]).map(normalizeMarketNews);const torneoConfigNews=torneiError?[]:(torneiRes.data||[]).flatMap(normalizeNews);allNews=[...torneoConfigNews,...manualNews,...torneoNews,...marketNews].sort(sortNews);render()}
(async()=>{isAdmin=await checkAdmin();await load()})();
</script>
</body>
</html>
