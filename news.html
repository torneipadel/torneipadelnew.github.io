den;box-shadow:0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:14px}.featuredMedia{width:100%;min-height:220px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14)}.featuredMedia img{width:100%;height:auto;max-height:650px;object-fit:contain;display:block}.featuredNoImage{min-height:220px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.52);font-weight:700;font-size:12px}.featuredBody{padding:24px}.badge{display:inline-flex;width:max-content;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);color:var(--gold);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px}.featuredBody h2{font-size:28px;line-height:1.12;letter-spacing:-.02em;margin:10px 0 7px}.date{color:rgba(255,255,255,.52);font-size:10px;margin-bottom:14px}.text{white-space:pre-line;color:rgba(255,255,255,.68);line-height:1.65;max-width:900px;font-size:12px}.cta{display:inline-flex;align-items:center;width:max-content;margin-top:14px;background:#fff;color:var(--blue);text-decoration:none;padding:10px 13px;border-radius:10px;font:800 9px 'Open Sans',Arial,sans-serif;box-shadow:none}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}.filter{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 11px;font:700 10px 'Open Sans',Arial,sans-serif;cursor:pointer}.filter.active,.filter:hover{background:#fff;color:var(--blue)}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.18);border-radius:20px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column}.cardMedia{aspect-ratio:16/10;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14)}.cardMedia img{width:100%;height:100%;object-fit:cover;display:block}.cardBody{padding:17px 17px 19px;display:flex;flex-direction:column;flex:1}.cardBody h3{margin:7px 0 7px;font-size:17px;line-height:1.2;letter-spacing:0}.cardBody p{margin:0;color:rgba(255,255,255,.62);line-height:1.45;font-size:11px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.cardBody .cta{margin-top:auto;align-self:flex-start}.smallDate{font-size:9px;color:rgba(255,255,255,.52);font-weight:700;letter-spacing:.01em}.adminDelete{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:max-content;margin-top:12px;padding:8px 11px;border:1px solid rgba(255,155,155,.18);border-radius:9px;background:rgba(255,155,155,.08);color:var(--red);font:700 9px 'Open Sans',Arial,sans-serif;cursor:pointer}.featuredBody .adminDelete{margin-top:12px}.empty{padding:30px 18px;border:1px dashed rgba(255,255,255,.22);border-radius:20px;background:rgba(255,255,255,.06);text-align:center;color:rgba(255,255,255,.62);font-size:12px}.loading{text-align:center;padding:54px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25);font-weight:700;font-size:12px}.np-menu,.np-menu a,.np-menu strong{font-family:'Open Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}

<body>
<div class="page">

<section class="heroTitle"><div class="eyebrow">Comunicazioni & contenuti</div><h1>News</h1><p>Tornei, promozioni, eventi, ricordi e novità del club.</p></section>
<main id="app"><div class="loading">Caricamento delle News…</div></main>
</div>
<script>
const SUPABASE_URL='https://dkeqicstprvvfebiaooc.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZXFpY3N0cHJ2dmZiaWFvY29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExNjQ2NjksImV4cCI6MjA3Njc0MDY2OX0.MPlE8CZ2B8pEhSJzTWBJ-FfFLQpwRAxlAlno-SCylWg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let allNews=[];let isAdmin=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeNews(row){const cfg=row?.configurazione||{};const arr=Array.isArray(cfg.news)?cfg.news:[];return arr.map((n,i)=>({...n,__torneo:row.nome||'',__torneoId:row.id,__index:i,__global:false,__ordine:Number(n.ordine)||999999,__data:n.data||row.updated_at||row.data_torneo||row.data||''}))}
function normalizeGlobalNews(row){return {...row,tipo:row.tipo||'Comunicazione',titolo:row.titolo||'Senza titolo',testo:row.testo||'',immagine:row.immagine||'',inEvidenza:false,link:'',__torneo:'',__torneoId:null,__index:-1,__global:true,__ordine:999999,__data:row.created_at||''}}
function normalizeTournamentNews(row){const cfg=row?.configurazione||{};const poster=Array.isArray(cfg.news)?cfg.news.find(n=>n?.immagine)?.immagine||'':'';const d=row?.data_torneo||row?.data||'';const slug=(new URLSearchParams(location.search).get('azienda')||'').trim();return {tipo:'Torneo',titolo:row?.nome||'Torneo',testo:row?.descrizione||'Scopri il torneo, i dettagli e le iscrizioni.',immagine:poster,inEvidenza:false,link:'tabellone.html?idTorneo='+encodeURIComponent(row.id)+(slug?'&azienda='+encodeURIComponent(slug):''),__torneo:row?.nome||'',__torneoId:row?.id,__index:-1,__global:true,__ordine:500000,__data:d||row?.updated_at||''}}
function normalizeMarketNews(row){const slug=(new URLSearchParams(location.search).get('azienda')||'').trim();return {tipo:'Offerta',titolo:row?.titolo||'Articolo del Mercatino',testo:row?.anteprima||row?.descrizione||'Articolo disponibile nel Mercatino.',immagine:row?.immagine||'',inEvidenza:false,link:'mercatino.html'+(slug?'?azienda='+encodeURIComponent(slug):''),__torneo:'Mercatino',__torneoId:null,__index:-1,__global:true,__ordine:750000,__data:row?.created_at||''}}
function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})}
function sortNews(a,b){if(Boolean(b.inEvidenza)!==Boolean(a.inEvidenza))return b.inEvidenza?1:-1;if(a.__ordine!==b.__ordine)return a.__ordine-b.__ordine;return String(b.__data).localeCompare(String(a.__data))}
function imageTag(src,alt,cls){return src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:''}
function deleteButton(n){return isAdmin&&!n.__global?`<button class="adminDelete" type="button" onclick="deleteNews('${esc(String(n.__torneoId))}',${Number(n.__index)})">🗑 Elimina</button>`:''}
function render(list=allNews){const app=document.getElementById('app');if(!list.length){app.innerHTML='<div class="empty">Non ci sono News pubblicate al momento.</div>';return}const featured=list.find(n=>n.inEvidenza)||list[0];const cats=['Tutte',...new Set(list.map(n=>n.tipo||'Comunicazione'))];const cards=list.filter(n=>n!==featured);app.innerHTML=`<section class="featured"><div class="featuredMedia">${featured.immagine?imageTag(featured.immagine,featured.titolo||'Locandina',''): '<div class="featuredNoImage">News in evidenza</div>'}</div><div class="featuredBody"><span class="badge">${esc(featured.tipo||'Comunicazione')}</span><h2>${esc(featured.titolo||'Senza titolo')}</h2><div class="date">${esc(formatDate(featured.__data))}${featured.__torneo?' · '+esc(featured.__torneo):''}</div><div class="text">${esc(featured.testo||'')}</div>${featured.link?`<a class="cta" href="${esc(featured.link)}" target="_blank" rel="noopener">Scopri di più →</a>`:''}${deleteButton(featured)}</div></section><div class="filters">${cats.map((c,i)=>`<button class="filter ${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><section class="grid" id="newsGrid">${cards.map(cardHtml).join('')}</section>`;document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const cat=btn.dataset.cat;document.getElementById('newsGrid').innerHTML=list.filter(n=>n!==featured&&(cat==='Tutte'||(n.tipo||'Comunicazione')===cat)).map(cardHtml).join('')}))}
function cardHtml(n){return `<article class="card">${n.immagine?`<div class="cardMedia">${imageTag(n.immagine,n.titolo||'News','')}</div>`:''}<div class="cardBody"><span class="smallDate">${esc(n.tipo||'Comunicazione')} · ${esc(formatDate(n.__data))}</span><h3>${esc(n.titolo||'Senza titolo')}</h3><p>${esc(n.testo||'')}</p>${n.link?`<a class="cta" href="${esc(n.link)}" target="_blank" rel="noopener">Apri →</a>`:''}${deleteButton(n)}</div></article>`}
async function checkAdmin(){try{const {data:{session}}=await sb.auth.getSession();if(!session?.user?.email)return false;const {data,error}=await sb.from('profili').select('ruolo').eq('email',session.user.email).maybeSingle();if(error){console.warn('Verifica ruolo admin:',error);return false}return String(data?.ruolo||'').toLowerCase()==='admin'}catch(e){console.warn('Verifica admin non disponibile:',e);return false}}
async function deleteNews(torneoId,index){if(!isAdmin)return;if(!Number.isInteger(index)||index<0)return;const news=allNews.find(n=>String(n.__torneoId)===String(torneoId)&&Number(n.__index)===index);const titolo=news?.titolo||'questa News';if(!confirm(`Eliminare definitivamente "${titolo}"?`))return;const {data,error}=await sb.from('tornei').select('configurazione').eq('id',torneoId).maybeSingle();if(error||!data){alert('Impossibile recuperare la News da eliminare.');console.error(error);return}const cfg=data.configurazione&&typeof data.configurazione==='object'?{...data.configurazione}:{};const arr=Array.isArray(cfg.news)?cfg.news:[];if(index>=arr.length){alert('La News non è più disponibile.');await load();return}cfg.news=arr.filter((_,i)=>i!==index);const {error:updateError}=await sb.from('tornei').update({configurazione:cfg}).eq('id',torneoId);if(updateError){alert('Eliminazione non riuscita.');console.error(updateError);return}await load()}
async function load(){const slug=(new URLSearchParams(location.search).get('azienda')||'').trim();if(!slug){document.getElementById('app').innerHTML='<div class="empty">Seleziona una società per visualizzare le News.</div>';return}const companyRes=await sb.rpc('get_public_company',{p_slug:slug});const company=Array.isArray(companyRes.data)?companyRes.data[0]:companyRes.data;if(companyRes.error||!company?.id){document.getElementById('app').innerHTML='<div class="empty">Società non trovata o non disponibile.</div>';return}const [torneiRes,globalRes,marketRes]=await Promise.all([sb.rpc('get_public_tornei',{p_torneo_id:null,p_azienda_id:company.id}),sb.rpc('get_public_company_news',{p_slug:slug}),sb.rpc('get_public_company_mercatino',{p_slug:slug})]);const torneiError=torneiRes.error,globalError=globalRes.error,marketError=marketRes.error;if(torneiError&&globalError&&marketError){document.getElementById('app').innerHTML='<div class="empty">Le News non sono momentaneamente disponibili.</div>';console.error(torneiError,globalError,marketError);return}const scopedTournaments=(torneiRes.data||[]).filter(t=>String(t.azienda_id||'')===String(company.id));const manualNews=globalError?[]:(globalRes.data||[]).map(normalizeGlobalNews);const torneoNews=torneiError?[]:scopedTournaments.filter(t=>t.pubblicato===true||String(t.stato||'').toLowerCase()==='attivo').map(normalizeTournamentNews);const marketNews=marketError?[]:(marketRes.data||[]).map(normalizeMarketNews);const torneoConfigNews=torneiError?[]:scopedTournaments.flatMap(normalizeNews);allNews=[...torneoConfigNews,...manualNews,...torneoNews,...marketNews].sort(sortNews);render()}
(async()=>{isAdmin=await checkAdmin();await load()})();
</script>
<script>
(function isolateNewsEventourLogo(){
 const logo=document.querySelector(".news-eventour-logo");
 if(!logo)return;
 function isolate(){
  if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;
  logo.dataset.textIsolated="1";
  try{
   const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;
   const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(logo,0,0);
   const frame=ctx.getImageData(0,0,canvas.width,canvas.height),px=frame.data;
   for(let i=0;i<px.length;i+=4){const lum=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];const alpha=Math.max(0,Math.min(255,Math.round((lum-132)*255/123)));px[i]=255;px[i+1]=255;px[i+2]=255;px[i+3]=Math.round(px[i+3]*alpha/255)}
   ctx.putImageData(frame,0,0);logo.src=canvas.toDataURL("image/png");
  }catch(e){console.warn("Isolamento logo EVENTOUR nelle News non riuscito:",e)}
 }
 if(logo.complete){if(logo.naturalWidth)isolate();else logo.addEventListener("load",isolate,{once:true})}else logo.addEventListener("load",isolate,{once:true});
})();
</script>
