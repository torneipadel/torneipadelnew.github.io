<section class="heroTitle"><div class="eyebrow">Comunicazioni & contenuti</div><h1>News</h1><p>Comunicazioni, promozioni, eventi, ricordi e novità della società.</p></section>

<script>
const SUPABASE_URL='https://dkeqicstprvvfebiaooc.supabase.co';
const SUPABASE_KEY='sb_publishable_EBgrU25BpXMp9x6a2n7_Pg_FTFa5JLu';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
// Condivide il client già inizializzato con lo stesso carosello sponsor usato dal tabellone.
window.sb=sb;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const formatDate=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})};
const imageTag=(src,alt,cls)=>src?'<img class="'+cls+'" src="'+esc(src)+'" alt="'+esc(alt)+'" loading="lazy">':'';
function cardHtml(n){const im=n.locandina||n.immagine||'';return '<article class="card">'+(im?'<div class="cardMedia">'+imageTag(im,n.titolo||'News','')+'</div>':'')+'<div class="cardBody"><span class="smallDate">'+esc(n.tipo||'Comunicazione')+' · '+esc(formatDate(n.created_at))+'</span><h3>'+esc(n.titolo||'Senza titolo')+'</h3><p>'+esc(n.testo||'')+'</p><button type="button" class="cta" data-open-news="'+esc(n.id)+'">Leggi la notizia →</button></div></article>'}
function safeExternalUrl(value){try{const u=new URL(String(value||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
function renderNews(list){
 if(!list.length){app.innerHTML='<div class="empty">Questa società non ha ancora pubblicato News.</div>';return}
 const featured=list.find(n=>n.in_evidenza)||list[0],cards=list.filter(n=>n.id!==featured.id);
 const im=featured.locandina||featured.immagine||'';
 const cats=['Tutte',...new Set(list.map(n=>n.tipo||'Comunicazione'))];
 app.innerHTML='<section class="featured"><div class="featuredMedia">'+(im?imageTag(im,featured.titolo||'News',''):'<div class="featuredNoImage">News in evidenza</div>')+'</div><div class="featuredBody"><span class="badge">'+esc(featured.tipo||'Comunicazione')+'</span><h2>'+esc(featured.titolo||'Senza titolo')+'</h2><div class="date">'+esc(formatDate(featured.created_at))+'</div><div class="text">'+esc(featured.testo||'')+'</div>'+'<button type="button" class="cta" data-open-news="'+esc(featured.id)+'">Leggi la notizia →</button>'+'</div></section><div class="filters">'+cats.map((x,i)=>'<button class="filter '+(i===0?'active':'')+'" data-cat="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div><section class="grid" id="newsGrid">'+cards.map(cardHtml).join('')+'</section><div class="news-detail" id="newsDetail" aria-hidden="true"><article class="news-detail-panel" role="dialog" aria-modal="true" aria-labelledby="newsDetailTitle"><button type="button" class="news-detail-close" data-close-news aria-label="Chiudi">×</button><div id="newsDetailContent"></div></article></div>';
 app.onclick=e=>{const open=e.target.closest('[data-open-news]');if(open){openNewsDetail(open.dataset.openNews,list);return}if(e.target===document.getElementById('newsDetail')||e.target.closest('[data-close-news]'))closeNewsDetail()};
 document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const cat=btn.dataset.cat;document.getElementById('newsGrid').innerHTML=list.filter(n=>n.id!==featured.id&&(cat==='Tutte'||(n.tipo||'Comunicazione')===cat)).map(cardHtml).join('')}));
}
function openNewsDetail(id,list){const n=list.find(x=>String(x.id)===String(id));if(!n)return;const box=document.getElementById('newsDetailContent'),overlay=document.getElementById('newsDetail');if(!box||!overlay)return;const im=n.locandina||n.immagine||'',url=safeExternalUrl(n.link);box.innerHTML=(im?'<div class="news-detail-media">'+imageTag(im,n.titolo||'News','')+'</div>':'')+'<div class="news-detail-body"><span class="badge">'+esc(n.tipo||'Comunicazione')+'</span><h2 id="newsDetailTitle">'+esc(n.titolo||'Senza titolo')+'</h2><div class="date">Pubblicata il '+esc(formatDate(n.created_at))+'</div><div class="text">'+esc(n.testo||'')+'</div>'+(url?'<a class="cta" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Apri il link →</a>':'')+'</div>';overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';overlay.querySelector('[data-close-news]')?.focus()}
function closeNewsDetail(){const overlay=document.getElementById('newsDetail');if(!overlay)return;overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNewsDetail()});
async function loadNews(){
 const slug=(new URLSearchParams(location.search).get('azienda')||'').trim();
 if(!slug){app.innerHTML='<div class="empty">Società non specificata. Apri le News dalla pagina della società.</div>';return}
 const companyRes=await sb.rpc('get_public_company',{p_slug:slug});
 const company=Array.isArray(companyRes.data)?companyRes.data[0]:companyRes.data;
 if(companyRes.error||!company?.id){console.error('Verifica società News:',companyRes.error);app.innerHTML='<div class="empty">Società non trovata o non disponibile.</div>';return}
 const newsRes=await sb.rpc('get_public_company_news_v2',{p_slug:slug});
 if(newsRes.error){console.error('Caricamento News:',newsRes.error);app.innerHTML='<div class="empty">Le News di questa società non sono momentaneamente disponibili.</div>';return}
 const list=(newsRes.data||[]).filter(n=>{const t=String(n?.tipo||'').trim().toLowerCase();return n.pubblicata===true&&(n.torneo_id===null||n.torneo_id===undefined)&&!t.includes('torneo')&&!t.includes('mercatin')&&!t.includes('prodotto')&&!t.includes('articol')}).sort((a,b)=>Number(!!b.in_evidenza)-Number(!!a.in_evidenza)||(Number(a.ordine)||0)-(Number(b.ordine)||0)||String(b.created_at||'').localeCompare(String(a.created_at||'')));
 renderNews(list);
}
loadNews().catch(error=>{console.error('Errore pagina News:',error);app.innerHTML='<div class="empty">Errore durante il caricamento delle News. Riprova più tardi.</div>'});</script>


<script>
(function isolateNewsEventourLogo(){
 const logo=document.querySelector(".news-eventour-logo");
 if(!logo)return;
 function isolate(){
  if(!logo.naturalWidth||!logo.naturalHeight||logo.dataset.textIsolated==="1")return;
  logo.dataset.textIsolated="1";
  try{
   const canvas=document.createElement("canvas");canvas.width=logo.naturalWidth;canvas.height=logo.naturalHeight;
